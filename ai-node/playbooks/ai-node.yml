---
# The AI node playbook. tockmox-ai-node-converge runs it against a local checkout of the toolkit
# (not ansible-pull, so that fetch, verify, decrypt and run are distinct phases) with
#
#   -e @<one file built by site_vars.py from ai-nodes/<id>/ai-node.yaml and desired.yaml>
#
# ai-node.yaml is authored; desired.yaml is generated by `python -m app.ai_nodes render`. Both reach
# the play as ONE variable, tn_site.ai_node and tn_site.desired, never as top-level variables, and
# ai_node_assert checks them against ai-node/schema/*.json before any other role runs.
# Nothing here is keyed by a host name: one file serves every node, and a second node is a second
# directory in the site repository.
#
# ORDER IS A SAFETY PROPERTY.
#   1. ai_node_assert changes nothing and refuses a node that cannot be converged safely.
#   2. firewall comes next, before any listener exists, and sets firewall_anchor_verified.
#      Every role that opens a port binds 127.0.0.1 until that fact is true.
#   3. Then the account tree, packages, base posture, GPU memory, exporters, ollama, the models,
#      and last the engines that need models on disk, then the timers.
#   4. rootfacts runs in `always`, so the root-only readiness facts are refreshed even when a
#      role above failed.

- name: AI node convergence
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Everything below turns the two authored/generated files into names the roles use. They are
    # play vars, so they stay lazy.
    # The site files are reachable only through these two names. They arrive as ONE extra-var, tn_site,
    # built by tockmox-ai-node-converge (playbooks/site_vars.py): nothing in a site file can become a
    # variable of its own, so it cannot override a role default such as firewall_pfctl, and it is
    # tagged !unsafe, so no string in it is ever evaluated as a template.
    tn_ai_node: "{{ (tn_site | default({})).ai_node | default({}) }}"
    tn_desired: "{{ (tn_site | default({})).desired | default({}) }}"
    tn_node_id: "{{ tockmox_ai_node_id | default(tn_ai_node.aiNodeId | default('')) }}"
    tn_family: "{{ (tn_ai_node.os | default({})).family | default('macos') }}"
    tn_min_version: "{{ (tn_ai_node.os | default({})).minVersion | default('26.2') | string }}"
    tn_expected_build: "{{ (tn_ai_node.os | default({})).expectedBuild | default('', true) | string }}"
    # YAML 1.1 turns an unquoted off/on into a boolean. The renderer refuses those, but a file that
    # got here some other way is read the same as the quoted word, and anything else is "invalid"
    # for ai_node_assert to name.
    tn_filevault_raw: "{{ (tn_ai_node.os | default({})).filevault | default('off', true) | string | lower }}"
    tn_filevault: "{{ 'off' if tn_filevault_raw in ['off', 'false'] else ('on_ssh_unlock' if tn_filevault_raw == 'on_ssh_unlock' else 'invalid') }}"
    tn_prevent_sleep: "{{ (tn_ai_node.power | default({})).preventSleep | default(true) | bool }}"
    tn_auto_restart: "{{ (tn_ai_node.power | default({})).autoRestart | default(true) | bool }}"
    tn_admin_cidrs: "{{ (tn_ai_node.access | default({})).adminCidrs | default([]) }}"
    tn_admin_user: "{{ tockmox_admin_user | default('') }}"
    tn_ssh_allow_users: "{{ (tn_ai_node.access | default({})).sshAllowUsers | default([]) }}"
    tn_screen_sharing: "{{ (tn_ai_node.access | default({})).screenSharing | default(false) | bool }}"
    tn_legacy: "{{ tn_ai_node.legacy | default(none) }}"
    tn_hold_engine_settings: "{{ (tn_ai_node.legacy | default(none) is mapping) and (tn_ai_node.legacy.holdEngineSettings | default(false) | bool) }}"
    tn_converge_user: "{{ (tn_ai_node.accounts | default({})).converge | default('tockmox') }}"
    tn_service_user: >-
      {{ tn_ai_node.legacy.serviceUser if (tn_ai_node.legacy | default(none) is mapping)
         else ((tn_ai_node.accounts | default({})).service | default('inference')) }}
    tn_prefix: "{{ (tn_ai_node.labels | default({})).prefix | default('com.tockmox.ai-node') }}"
    tn_root: "{{ (tn_ai_node.paths | default({})).root | default('/opt/tockmox') }}"
    tn_wired_limit_mib: "{{ (tn_ai_node.gpu | default({})).wiredLimitMiB | default(0) | int }}"
    tn_mlx_version: "{{ ((tn_ai_node.engines | default({}))['mlx-lm'] | default({})).version | default('', true) | string }}"
    tn_mlx_python: "{{ ((tn_ai_node.engines | default({}))['mlx-lm'] | default({})).python | default('3.12', true) | string }}"
    tn_mlx_extra_args: "{{ ((tn_ai_node.engines | default({}))['mlx-lm'] | default({})).extraArgs | default([], true) }}"
    tn_mlx_max_output_tokens: "{{ ((tn_ai_node.engines | default({}))['mlx-lm'] | default({})).maxOutputTokens | default(0, true) | int }}"
    tn_mlx_patches: "{{ ((tn_ai_node.engines | default({}))['mlx-lm'] | default({})).patches | default([], true) | map('string') | list }}"
    tn_llama_formula: "{{ ((tn_ai_node.engines | default({}))['llama-server'] | default({})).brewFormula | default('llama.cpp', true) }}"
    tn_llama_extra_args: "{{ ((tn_ai_node.engines | default({}))['llama-server'] | default({})).extraArgs | default([], true) }}"
    tn_ollama_env: "{{ ((tn_ai_node.engines | default({})).ollama | default({})).env | default({}, true) }}"
    tn_keep_unreferenced_days: "{{ (((tn_ai_node.models | default({})).retain | default({})).keepUnreferencedDays) | default(14, true) | int }}"
    tn_strip_spotlight_raw: "{{ (tn_ai_node.strip | default({})).spotlight | default('off', true) | string | lower }}"
    tn_strip_timemachine_raw: "{{ (tn_ai_node.strip | default({})).timeMachine | default('off', true) | string | lower }}"
    tn_strip_analytics_raw: "{{ (tn_ai_node.strip | default({})).analytics | default('off', true) | string | lower }}"
    tn_strip_siri_raw: "{{ (tn_ai_node.strip | default({})).siri | default('off', true) | string | lower }}"
    tn_strip_spotlight: "{{ 'off' if tn_strip_spotlight_raw in ['off', 'false'] else ('on' if tn_strip_spotlight_raw in ['on', 'true'] else 'invalid') }}"
    tn_strip_timemachine: "{{ 'off' if tn_strip_timemachine_raw in ['off', 'false'] else ('on' if tn_strip_timemachine_raw in ['on', 'true'] else 'invalid') }}"
    tn_strip_analytics: "{{ 'off' if tn_strip_analytics_raw in ['off', 'false'] else ('on' if tn_strip_analytics_raw in ['on', 'true'] else 'invalid') }}"
    tn_strip_siri: "{{ 'off' if tn_strip_siri_raw in ['off', 'false'] else ('on' if tn_strip_siri_raw in ['on', 'true'] else 'invalid') }}"
    tn_auto_install_updates: "{{ (tn_ai_node.updates | default({})).autoInstall | default(false) | bool }}"
    tn_node_exporter_port: "{{ (tn_ai_node.telemetry | default({})).nodeExporterPort | default(9100) | int }}"
    tn_macmon_port: "{{ (tn_ai_node.telemetry | default({})).macmonPort | default(9101) | int }}"
    tn_instances: "{{ tn_desired.instances | default([]) }}"
    tn_models_present: "{{ tn_desired.modelsPresent | default([]) }}"
    tn_firewall: "{{ tn_desired.firewall | default({}) }}"
    tn_brew: /opt/homebrew/bin/brew
    tn_brew_prefix: /opt/homebrew
    tn_launchd_dir: "{{ tockmox_launchd_dir | default('/Library/LaunchDaemons') }}"
    tn_converge_interval: "{{ tockmox_converge_interval | default(900) | int }}"
    tn_signing_mode: "{{ tockmox_signing_mode | default('warn') }}"
    tn_toolkit_dir: "{{ tockmox_toolkit_dir | default(playbook_dir ~ '/../..') }}"
    tn_linux_message: >-
      Linux support is phase 6 of the AI node plan and is not in this release. This toolkit
      converges Apple-silicon Macs. The Linux roles are stubs that stop here so that a node
      declared os.family linux fails with this sentence and not with a half-applied play.

  tasks:
    - name: Converge the node
      block:
        - name: Check the node can be converged (changes nothing)
          ansible.builtin.import_role:
            name: ai_node_assert
          # `always`: the site files are checked against their schemas even on a --tags run.
          tags: [assert, always_assert, always]

        - name: Firewall first
          ansible.builtin.import_role:
            name: firewall
          tags: [firewall, security]

        - name: Accounts and the install tree
          ansible.builtin.import_role:
            name: macos_accounts
          tags: [accounts]

        - name: Homebrew baseline
          ansible.builtin.import_role:
            name: homebrew_baseline
          tags: [homebrew, baseline]

        - name: Remote login
          ansible.builtin.import_role:
            name: macos_remote_access
          tags: [remote_access, ssh]

        - name: Base posture (sleep, file limits)
          ansible.builtin.import_role:
            name: macos_base
          tags: [base]

        - name: Strip background services
          ansible.builtin.import_role:
            name: macos_strip
          tags: [strip]

        - name: Software update posture
          ansible.builtin.import_role:
            name: macos_updates
          tags: [updates]

        - name: GPU wired-memory limit
          ansible.builtin.import_role:
            name: gpu_memory
          tags: [gpu, iogpu]

        - name: Exporters
          ansible.builtin.import_role:
            name: exporters
          tags: [exporters, monitoring]

        - name: Ollama
          ansible.builtin.import_role:
            name: engine_ollama
          tags: [engines, ollama]

        - name: Models at their pinned revisions
          ansible.builtin.import_role:
            name: model_sync
          tags: [models, model_sync]

        - name: Run the mlx-lm engines
          ansible.builtin.import_role:
            name: engine_mlx_lm
          tags: [engines, mlx_lm]

        - name: Run the llama-server engines
          ansible.builtin.import_role:
            name: engine_llama_server
          tags: [engines, llama_server]

        - name: Converge and facts timers
          ansible.builtin.import_role:
            name: converge_timer
          tags: [timer, converge_timer]
      always:
        - name: Refresh the readiness facts only root can read
          ansible.builtin.import_role:
            name: rootfacts
          tags: [always]
