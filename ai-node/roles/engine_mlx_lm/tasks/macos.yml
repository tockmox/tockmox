---
# mlx-lm, one server process per instance (a process serves one model), in a virtual
# environment at a pinned version, with the Hugging Face hub in offline mode. The weights arrive only
# through model_sync.
#
# THE ENGINE IS STARTED BY REPOSITORY ID, NOT BY SNAPSHOT PATH. mlx_lm.server 0.32 keys its
# loaded model by the string it was started with and treats a request's "model" as a name to load: started
# with the snapshot path, it listed that path in /v1/models and answered a request naming the repository id
# (what every gateway route sends) by trying to load the id from the cache at `main`, which offline and with
# no refs/main fails. Started with the id, the default model and a request by id are the same key (no
# reload), /v1/models lists the id, and the id resolves offline to the pinned snapshot through the refs/main
# model_sync writes. mlx-lm has no served-name flag, so the route's model must BE the repository id.
#
# EVERY INSTANCE RUNS UNDER THE REQUEST GUARD (files/tockmox_mlx_lm_guard.py). mlx_lm.server loads
# whatever model, adapter or draft model a request names, so one request could swap another model from the
# shared cache in place of the declared one. The guard answers such a request 404/400 before mlx-lm sees it,
# lists only the declared id in /v1/models, and with engines.mlx-lm.maxOutputTokens lowers any request's
# max_tokens to that ceiling (mlx-lm otherwise takes the request's value over --max-tokens).

- name: Make sure the firewall verdict is known
  ansible.builtin.include_role:
    name: firewall
    tasks_from: verify
  when: firewall_anchor_verified is not defined

- name: Pick the mlx-lm instances
  ansible.builtin.set_fact:
    engine_mlx_lm_wanted: "{{ tn_instances | selectattr('engine', 'equalto', 'mlx-lm') | list }}"

- name: Resolve each instance to its label and model path
  ansible.builtin.set_fact:
    engine_mlx_lm_resolved: >-
      {{ (engine_mlx_lm_resolved | default([])) + [ {
           'id': item.id,
           'port': item.port | int,
           'label': item | tockmox_instance_label(tn_prefix),
           'model': item.models[0].model,
           'repo': item.models[0].artifact.ref,
           'snapshot': item.models[0].artifact.ref | tockmox_hf_snapshot(item.models[0].artifact.revision, tn_root),
           'log': tn_root ~ '/log/' ~ (item | tockmox_instance_slug) ~ '.log'
         } ] }}
  loop: "{{ engine_mlx_lm_wanted }}"
  loop_control:
    label: "{{ item.id }}"

# The engine watch (bin/tockmox-ai-node-engine-watch, every 60 s as root) restarts an instance whose
# /health answers 503: the process is up but its generation thread died, so launchd's KeepAlive never
# fires. Written on every run, empty when no instance is wanted, so a removed instance stops being watched.
- name: Tell the engine watch which instances to check
  become: true
  block:
    - name: Create the engine watch directory
      ansible.builtin.file:
        path: "{{ tn_root }}/etc/engine-watch.d"
        state: directory
        owner: "{{ tn_converge_user }}"
        group: staff
        mode: "0755"

    - name: List the mlx-lm instances and their health path
      ansible.builtin.copy:
        dest: "{{ tn_root }}/etc/engine-watch.d/mlx-lm.tsv"
        owner: "{{ tn_converge_user }}"
        group: staff
        mode: "0644"
        content: |
          # Managed by tockmox-ai-node (role engine_mlx_lm). label<TAB>port<TAB>health path.
          {% for i in engine_mlx_lm_resolved | default([]) %}{{ [i.label, i.port, '/health'] | join(engine_mlx_lm_tab) }}
          {% endfor %}

- name: Install and run the instances
  when: engine_mlx_lm_wanted | length > 0
  block:
    - name: The engine version and the Python are pinned in ai-node.yaml
      ansible.builtin.assert:
        that:
          - tn_mlx_version | length > 0
          - tn_mlx_python is match('^[0-9]+\.[0-9]+$')
        fail_msg: >-
          An mlx-lm instance is asked for but engines.mlx-lm.version is empty. Pin a release, for example
          "0.32.2": a node that installs whatever is newest is not one that can be rebuilt from git.
        quiet: true

    - name: The request guard was tested on the pinned mlx-lm release
      ansible.builtin.assert:
        that:
          - tn_mlx_version in engine_mlx_lm_guard_vetted
        fail_msg: >-
          mlx-lm {{ tn_mlx_version }} is not a release the toolkit's request guard was tested on
          ({{ engine_mlx_lm_guard_vetted | join(', ') }}). The guard wraps internal mlx_lm.server handlers that a
          release can change; pin a tested release, or use a toolkit version that lists this one.
        quiet: true

    - name: Install the Python
      ansible.builtin.include_role:
        name: homebrew_baseline
        tasks_from: ensure
      vars:
        homebrew_baseline_ensure: ["python@{{ tn_mlx_python }}"]

    - name: Create the engine directory
      become: true
      ansible.builtin.file:
        path: "{{ engine_mlx_lm_dir }}"
        state: directory
        owner: "{{ tn_service_user }}"
        group: staff
        mode: "0755"

    - name: Create the virtual environment
      become: true
      become_user: "{{ tn_service_user }}"
      ansible.builtin.command:
        cmd: "{{ tn_brew_prefix }}/opt/python@{{ tn_mlx_python }}/bin/python{{ tn_mlx_python }} -m venv {{ engine_mlx_lm_venv }}"
        creates: "{{ engine_mlx_lm_venv }}/bin/python"

    - name: Read the installed mlx-lm version
      become: true
      become_user: "{{ tn_service_user }}"
      ansible.builtin.command: "{{ engine_mlx_lm_venv }}/bin/pip show mlx-lm"
      register: engine_mlx_lm_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install the pinned mlx-lm
      become: true
      become_user: "{{ tn_service_user }}"
      ansible.builtin.command:
        argv: ["{{ engine_mlx_lm_venv }}/bin/pip", "install", "--disable-pip-version-check", "mlx-lm=={{ tn_mlx_version }}"]
      register: engine_mlx_lm_pip
      when: >-
        engine_mlx_lm_installed.stdout is not search('(?m)^Version: ' ~ (tn_mlx_version | regex_escape) ~ '$')
      changed_when: true

    # Toolkit patches (engines.mlx-lm.patches): fixes that exist upstream but are not in the pinned release.
    # Each is vetted against one exact release and lives at files/patches/<version>/<name>.patch, so a version
    # bump with a patch still named stops here until the patch is re-vetted or dropped. The helper starts every
    # change of the patch set from a clean reinstall, so removing a name restores the release as published.
    - name: Every named patch exists for the pinned mlx-lm release
      ansible.builtin.stat:
        path: "{{ role_path }}/files/patches/{{ tn_mlx_version }}/{{ item }}.patch"
      loop: "{{ tn_mlx_patches }}"
      register: engine_mlx_lm_patch_stat

    - name: A patch the toolkit does not have for this release is refused
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          engines.mlx-lm.patches names {{ item.item }}, and the toolkit has no {{ item.item }} patch for
          mlx-lm {{ tn_mlx_version }}. A patch is vetted against one release: remove the name, or pin the
          release it was written for.
        quiet: true
      loop: "{{ engine_mlx_lm_patch_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stage the patch helper and the named patches
      become: true
      block:
        - name: Create the patch directory
          ansible.builtin.file:
            path: "{{ engine_mlx_lm_patch_dir }}"
            state: directory
            owner: "{{ tn_service_user }}"
            group: staff
            mode: "0755"

        - name: Copy the helper from the toolkit checkout
          ansible.builtin.copy:
            src: "{{ tn_toolkit_dir }}/ai-node/bin/tockmox-ai-node-engine-patch"
            dest: "{{ engine_mlx_lm_patch_dir }}/tockmox-ai-node-engine-patch"
            owner: "{{ tn_service_user }}"
            group: staff
            mode: "0755"

        - name: Copy each named patch
          ansible.builtin.copy:
            src: "{{ role_path }}/files/patches/{{ tn_mlx_version }}/{{ item }}.patch"
            dest: "{{ engine_mlx_lm_patch_dir }}/{{ item }}.patch"
            owner: "{{ tn_service_user }}"
            group: staff
            mode: "0644"
          loop: "{{ tn_mlx_patches }}"

    - name: Put the release and exactly the named patches in the virtual environment
      become: true
      become_user: "{{ tn_service_user }}"
      when: not ansible_check_mode
      ansible.builtin.command:
        argv: "{{ [engine_mlx_lm_patch_dir ~ '/tockmox-ai-node-engine-patch', '--venv', engine_mlx_lm_venv,
                   '--package', 'mlx-lm', '--version', tn_mlx_version, '--patches', engine_mlx_lm_patch_dir, '--']
                  + tn_mlx_patches }}"
      register: engine_mlx_lm_patch
      changed_when: engine_mlx_lm_patch.stdout is search('^changed')

    - name: Say which patches the engine runs with
      become: true
      vars:
        engine_mlx_lm_patch_labels: 'ai_node="{{ tn_node_id }}",engine="mlx-lm",version="{{ tn_mlx_version }}"'
      ansible.builtin.copy:
        dest: "{{ tn_root }}/textfile/engine-patches.prom"
        owner: "{{ tn_converge_user }}"
        group: staff
        mode: "0644"
        content: |
          # HELP tockmox_ai_node_engine_patch_info A toolkit patch the engine's package carries (1 per patch).
          # TYPE tockmox_ai_node_engine_patch_info gauge
          {% for p in tn_mlx_patches %}tockmox_ai_node_engine_patch_info{{ '{' ~ engine_mlx_lm_patch_labels ~ ',patch="' ~ p ~ '"}' }} 1
          {% endfor %}

    - name: Install the request guard
      become: true
      ansible.builtin.copy:
        src: tockmox_mlx_lm_guard.py
        dest: "{{ engine_mlx_lm_guard }}"
        owner: "{{ tn_service_user }}"
        group: staff
        mode: "0755"
      register: engine_mlx_lm_guard_copy

    - name: Each instance serves its model under the repository id the routes send
      ansible.builtin.assert:
        that:
          - item.model == item.repo
          - item.repo not in (tn_models_present | tockmox_refs_at_several_revisions)
        fail_msg: >-
          {{ item.id }}: mlx-lm answers only to the Hugging Face repository id it was started with, and the
          cache names one revision per repository. The model must equal the artifact ref (got {{ item.model }}
          and {{ item.repo }}), and {{ item.repo }} must not be pinned at two revisions on this node.
        quiet: true
      loop: "{{ engine_mlx_lm_resolved }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Look for each instance's model on disk
      ansible.builtin.stat:
        path: "{{ item.snapshot }}"
      loop: "{{ engine_mlx_lm_resolved }}"
      loop_control:
        label: "{{ item.id }}"
      register: engine_mlx_lm_model_stat

    - name: A model that is not on disk is not started
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          {{ item.item.model }} is not on disk at {{ item.item.snapshot }}. model_sync fetches it at the
          pinned revision; run the whole converge, not only this role.
        quiet: true
      loop: "{{ engine_mlx_lm_model_stat.results }}"
      loop_control:
        label: "{{ item.item.id }}"

    - name: Run each instance
      ansible.builtin.include_role:
        name: launchd_service
      vars:
        launchd_service_label: "{{ item.label }}"
        launchd_service_user: "{{ tn_service_user }}"
        launchd_service_firewalled: true
        launchd_service_args: >-
          {{ [engine_mlx_lm_venv ~ '/bin/python', '-I', engine_mlx_lm_guard, '--model', item.repo, '--host',
              ('0.0.0.0' if (firewall_anchor_verified | bool) else '127.0.0.1'), '--port', item.port | string]
             + (tn_mlx_extra_args | map('string') | list) }}
        launchd_service_log: "{{ item.log }}"
        launchd_service_hold: "{{ tn_hold_engine_settings | bool }}"
        launchd_service_force_reload: >-
          {{ (engine_mlx_lm_pip is defined and engine_mlx_lm_pip is changed)
             or (engine_mlx_lm_patch is defined and engine_mlx_lm_patch is changed)
             or (engine_mlx_lm_guard_copy is defined and engine_mlx_lm_guard_copy is changed) }}
        launchd_service_process_type: Interactive
        launchd_service_env:
          HOME: "{{ tn_root }}/var/service-home"
          HF_HOME: "{{ tn_root }}/models/hf"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Empty: no ceiling. The guard reads it; mlx-lm does not.
          TOCKMOX_MLX_MAX_OUTPUT_TOKENS: "{{ (tn_mlx_max_output_tokens | int > 0) | ternary(tn_mlx_max_output_tokens | string, '') }}"
          PATH: "{{ engine_mlx_lm_venv }}/bin:{{ tn_brew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      loop: "{{ engine_mlx_lm_resolved }}"
      loop_control:
        label: "{{ item.id }}"

- name: Find daemons of instances that are no longer wanted
  when: tn_legacy is none
  become: true
  ansible.builtin.find:
    paths: "{{ tn_launchd_dir }}"
    patterns: "{{ tn_prefix }}.mlx-lm*.plist"
  register: engine_mlx_lm_existing

- name: Take them away
  when:
    - tn_legacy is none
    - (item.path | basename | regex_replace('\.plist$', '')) not in (engine_mlx_lm_resolved | default([]) | map(attribute='label') | list)
  ansible.builtin.include_role:
    name: launchd_service
  vars:
    launchd_service_label: "{{ item.path | basename | regex_replace('\\.plist$', '') }}"
    launchd_service_state: absent
  loop: "{{ engine_mlx_lm_existing.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
