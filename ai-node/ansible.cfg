#
# Used by tockmox-ai-node-converge (ANSIBLE_CONFIG points here) and by the tests.
# There is no inventory in the toolkit: the Mac converges itself, so the converger
# passes -i 'localhost,' -c local on the command line.
[defaults]
roles_path = roles
host_key_checking = False
stdout_callback = default
result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = True
# No ~/.ansible/cp or other per-user state beyond what Ansible itself needs.
nocows = True

[connection]
# Tasks that become the unprivileged service account (venv, model downloads) cannot read a
# module file left in the converge account's temp directory, and macOS has no setfacl. Pipelining
# feeds the module over stdin instead, so no temp file is shared between accounts.
pipelining = True
