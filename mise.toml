#
# THE TOOLCHAIN, PINNED ONCE.
#
# Every gate in tools/ predicts CI only when it runs with the tools CI runs.
# Helm 3 and Helm 4 have rendered the same chart differently, and a render
# test that passed under one failed under the other. So the versions live here,
# and everything else reads them or is checked against them:
#
#   tools/toolchain.sh --check   the tools on PATH match these pins; check-all.sh
#                                runs it first and refuses to start on a mismatch
#   tools/toolchain.sh --drift   every copy of a pin (a workflow's env block,
#                                CONTRIBUTING.md) says what this file says
#   tools/toolchain.sh --pins    KEY=VALUE lines a workflow step can read
#   tools/dev-env.sh             installs these versions: `mise install` where
#                                mise is present, checksum-verified release
#                                assets on Linux x86_64 where it is not
#
# With mise (https://mise.jdx.dev): `mise install`, then run the gates through
# `mise exec -- ./tools/check-all.sh`, or activate mise in your shell.
#
# Python is pinned to its minor version only. CI runners ship their own patch
# release, so toolchain.sh holds python3 to this minor version and not to a
# patch. The Python PACKAGES the gates import are pinned exactly, with hashes,
# in tools/requirements-gates.txt.
#
# Not here: promtool (ci.yaml installs it, and tools/check-alert-rules.sh skips
# without it), bash (4.0 or newer is a floor, checked by toolchain.sh; macOS
# ships 3.2, see CONTRIBUTING.md) and jq (any release).

[tools]
helm = "4.3.1"
kubeconform = "0.8.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
python = "3.12"

[settings]
lockfile = true
