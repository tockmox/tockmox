# The reference gateway route list (captured 2026-10-06, model_list only). Addresses replaced with
# documentation addresses. A fixture for importing a live LiteLLM config into the inventory.
# model ids, ports, providers and params are as captured. No secret values: api_key
# entries are either an os.environ reference or the literal "local-no-auth".
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
    - model_name: claude-sonnet-4-6
      litellm_params:
        model: anthropic/claude-sonnet-4-6
        api_key: os.environ/ANTHROPIC_API_KEY
        tags:
        - open
      model_info:
        endpoint_tier: external
    - model_name: claude-opus-4-8
      litellm_params:
        model: anthropic/claude-opus-4-8
        api_key: os.environ/ANTHROPIC_API_KEY
        tags:
        - open
      model_info:
        endpoint_tier: external
    - model_name: claude-opus-5
