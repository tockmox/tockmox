# TockmoxCNPGInstancesNotReady and TockmoxCNPGScrapeTargetAbsent.
#
# DO NOT SET rule_files; tools/check-alert-rules.sh injects the rendered rules.
#
# Every case asserts a direction: the rules fire on the shape they exist for and
# stay silent on the shape they must ignore. exp_annotations match the rendered
# text exactly, so editing an annotation fails this file on purpose.
#
# Case 3 is the one that matters. status.readyInstances is optional in the CRD,
# so a cluster with no ready instance can have no ready series, and a plain
# `desired - ready` returns nothing in the worst state. Cases 7, 9 and 10 pin the
# scrape-target rule to the `<namespace>/<name>` job convention.
evaluation_interval: 1m

tests:
  # 1. A healthy cluster (3 wanted, 3 ready, scraped) fires neither rule.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x90"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x90"
      - series: "up{job=\"apps/app-db\"}"
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []
      - eval_time: 80m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts: []

  # 2. One instance short (3 wanted, 2 ready): pending for the 15m `for`, then fires, with the shortfall as the value.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x90"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "2+0x90"
      - series: "up{job=\"apps/app-db\"}"
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 10m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []
      - eval_time: 16m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has fewer ready instances than it was asked for", "description": "The cluster has been short 1 instance(s) for fifteen minutes and is serving with less redundancy than configured. Kubernetes' replica-mismatch alerts cannot see this: the operator manages instance Pods directly, so there is no StatefulSet or Deployment to compare. Look at the instance Pods: `kubectl -n apps get pods -l cnpg.io/cluster=app-db`. A Pod stuck Pending usually means a volume that will not attach or a node that will not schedule it."}
      - eval_time: 25m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has fewer ready instances than it was asked for", "description": "The cluster has been short 1 instance(s) for fifteen minutes and is serving with less redundancy than configured. Kubernetes' replica-mismatch alerts cannot see this: the operator manages instance Pods directly, so there is no StatefulSet or Deployment to compare. Look at the instance Pods: `kubectl -n apps get pods -l cnpg.io/cluster=app-db`. A Pod stuck Pending usually means a volume that will not attach or a node that will not schedule it."}

  # 3. THE REGRESSION CASE. No instance is ready, so status.readyInstances may be absent and a subtraction against it
  #    returns nothing. The alert must fire anyway, with the whole desired count as the value. If someone
  #    simplifies the expression to the subtraction alone, this case goes red.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "2+0x90"
    alert_rule_test:
      - eval_time: 10m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []
      - eval_time: 25m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has fewer ready instances than it was asked for", "description": "The cluster has been short 2 instance(s) for fifteen minutes and is serving with less redundancy than configured. Kubernetes' replica-mismatch alerts cannot see this: the operator manages instance Pods directly, so there is no StatefulSet or Deployment to compare. Look at the instance Pods: `kubectl -n apps get pods -l cnpg.io/cluster=app-db`. A Pod stuck Pending usually means a volume that will not attach or a node that will not schedule it."}

  # 4. A ten-minute dip that recovers (a switchover, a drain, a rolling restart) never fires.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x90"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3x5 2x10 3x75"
    alert_rule_test:
      - eval_time: 14m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []
      - eval_time: 45m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []

  # 5. Two clusters, one short: only the short one fires, and it carries its own identity.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x90"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "2+0x90"
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"other-db\",namespace=\"apps\"}"
        values: "2+0x90"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"other-db\",namespace=\"apps\"}"
        values: "2+0x90"
    alert_rule_test:
      - eval_time: 25m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has fewer ready instances than it was asked for", "description": "The cluster has been short 1 instance(s) for fifteen minutes and is serving with less redundancy than configured. Kubernetes' replica-mismatch alerts cannot see this: the operator manages instance Pods directly, so there is no StatefulSet or Deployment to compare. Look at the instance Pods: `kubectl -n apps get pods -l cnpg.io/cluster=app-db`. A Pod stuck Pending usually means a volume that will not attach or a node that will not schedule it."}

  # 6. More ready than wanted (a scale-down in progress) is not a shortfall.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "2+0x90"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x90"
    alert_rule_test:
      - eval_time: 40m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []

  # 7. A cluster with no scrape target fires after the 30m `for`; its neighbour, which has one, does not.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x120"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x120"
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"other-db\",namespace=\"apps\"}"
        values: "2+0x120"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"other-db\",namespace=\"apps\"}"
        values: "2+0x120"
      - series: "up{job=\"apps/other-db\"}"
        values: "1+0x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts: []
      - eval_time: 32m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps", "job": "apps/app-db"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has no Prometheus scrape target", "description": "No `up` series exists for job `apps/app-db`, so the cluster's database metrics are not being collected and every alert that reads them is blind, not quiet. The cluster's own phase can read healthy throughout. Check that a PodMonitor named `app-db` exists in `apps` (`spec.monitoring.enablePodMonitor` on the Cluster creates one) and that its selector matches the instance Pods."}
      - eval_time: 45m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps", "job": "apps/app-db"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has no Prometheus scrape target", "description": "No `up` series exists for job `apps/app-db`, so the cluster's database metrics are not being collected and every alert that reads them is blind, not quiet. The cluster's own phase can read healthy throughout. Check that a PodMonitor named `app-db` exists in `apps` (`spec.monitoring.enablePodMonitor` on the Cluster creates one) and that its selector matches the instance Pods."}

  # 8. A target that EXISTS but is down is not this alert (the targets-down rule owns it): `up` is 0, not absent.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x120"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x120"
      - series: "up{job=\"apps/app-db\"}"
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts: []

  # 9. A target that was there and goes away fires once it has been gone for the `for`, not before.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x150"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x150"
      - series: "up{job=\"apps/app-db\"}"
        values: "1x20 _x130"
    alert_rule_test:
      - eval_time: 45m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts: []
      - eval_time: 75m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps", "job": "apps/app-db"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has no Prometheus scrape target", "description": "No `up` series exists for job `apps/app-db`, so the cluster's database metrics are not being collected and every alert that reads them is blind, not quiet. The cluster's own phase can read healthy throughout. Check that a PodMonitor named `app-db` exists in `apps` (`spec.monitoring.enablePodMonitor` on the Cluster creates one) and that its selector matches the instance Pods."}

  # 10. A target under a different job name does not count for this cluster: the job must be namespace/name.
  - interval: 1m
    input_series:
      - series: "tockmox_cnpg_cluster_desired_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x120"
      - series: "tockmox_cnpg_cluster_ready_instances{name=\"app-db\",namespace=\"apps\"}"
        values: "3+0x120"
      - series: "up{job=\"apps/other-name\"}"
        values: "1+0x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts:
          - exp_labels: {"severity": "warning", "name": "app-db", "namespace": "apps", "job": "apps/app-db"}
            exp_annotations: {"summary": "CNPG Cluster apps/app-db has no Prometheus scrape target", "description": "No `up` series exists for job `apps/app-db`, so the cluster's database metrics are not being collected and every alert that reads them is blind, not quiet. The cluster's own phase can read healthy throughout. Check that a PodMonitor named `app-db` exists in `apps` (`spec.monitoring.enablePodMonitor` on the Cluster creates one) and that its selector matches the instance Pods."}

  # 11. No CNPG cluster at all: nothing to be short of, nothing to be unscraped.
  - interval: 1m
    input_series:
      - series: "up{job=\"apps/anything\"}"
        values: "1+0x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: TockmoxCNPGInstancesNotReady
        exp_alerts: []
      - eval_time: 60m
        alertname: TockmoxCNPGScrapeTargetAbsent
        exp_alerts: []
