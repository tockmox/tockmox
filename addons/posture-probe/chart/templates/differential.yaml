{{- /*
SPDX-License-Identifier: Apache-2.0

The differential Job: the gate. Same schedule as the collectors; it matches them
by the run id Kubernetes puts in every Job name (<cronjob>-<scheduled minute>).
Its exit code is the gate contract (0 clean, 1 could not run, 2 drift), so a
drift run shows as a failed Job, which is the escalate-on-exception the threat
model asks for (s8). The report goes to the store volume, never to the log.
*/ -}}
{{- if .Values.enabled -}}
{{- $m := include "pp.model" . | fromJson -}}
{{- $st := .Values.store | default dict -}}
{{- $collect := int ((.Values.timeouts | default dict).collectSeconds | default 240) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: posture-probe-reports
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pp.labels" . | nindent 4 }}
  annotations:
    # The store outlives an uninstall on purpose: deleting evidence is the operator's act.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with $st.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $st.size | default "1Gi" | quote }}
---
# Binds the report claim at install. On a WaitForFirstConsumer StorageClass (the
# default on a fresh k3s: local-path) a claim stays Pending until a pod mounts
# it, and its only consumer is the differential Job, which may be a night away.
# Pending reads as not ready to `helm --wait` (the release ends failed) and as
# Progressing to Argo CD. This Job mounts the claim once and exits, so both
# reach ready on the first sync. The name carries a hash of everything the pod
# template takes from values: a Job's template cannot be updated in place, so a
# changed image makes a new Job and the old one is pruned with the release.
{{- $bind := printf "posture-probe-bind-%s" (dict "i" .Values.image "p" (.Values.imagePullPolicy | default "IfNotPresent") "r" .Values.resources | toJson | sha256sum | trunc 8) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bind }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pp.labels" . | nindent 4 }}
    app.kubernetes.io/component: binder
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posture-probe-binder
        app.kubernetes.io/part-of: posture-probe
        app.kubernetes.io/component: binder
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "pp.podSecurity" . | nindent 6 }}
      containers:
        - name: bind
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          # Prints usage and exits 0: the image needs no other entry point to be a consumer.
          args: ["--help"]
          {{- include "pp.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: reports, mountPath: /reports }
      volumes:
        - name: reports
          persistentVolumeClaim: { claimName: posture-probe-reports }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: posture-probe-differential
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pp.labels" . | nindent 4 }}
    app.kubernetes.io/component: differential
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ .Values.suspend | default false }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: posture-probe
        app.kubernetes.io/component: differential
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ add $collect 300 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: posture-probe-differential
            app.kubernetes.io/part-of: posture-probe
            app.kubernetes.io/component: differential
          annotations:
            checksum/config: {{ include "pp.model" . | sha256sum | trunc 16 | quote }}
        spec:
          restartPolicy: Never
          serviceAccountName: posture-probe
          # Needs the API: the reads and the oracle in rbac.yaml, nothing else.
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: differential
              image: {{ .Values.image | quote }}
              imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
              args: ["differential"]
              env:
                - name: POSTURE_RUN_JOB
                  valueFrom: { fieldRef: { fieldPath: "metadata.labels['job-name']" } }
                - { name: POSTURE_CONFIG_DIR, value: /etc/posture-probe }
                - { name: POSTURE_REPORT_DIR, value: /reports }
              {{- include "pp.containerSecurity" . | nindent 14 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - { name: config, mountPath: /etc/posture-probe, readOnly: true }
                - { name: reports, mountPath: /reports }
          volumes:
            - name: config
              configMap: { name: posture-probe-config }
            - name: reports
              persistentVolumeClaim: { claimName: posture-probe-reports }
{{- end }}
