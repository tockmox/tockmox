# SPDX-License-Identifier: Apache-2.0
#
# CodeQL static analysis over the repository's Python (tockmox-ui/, tools/,
# addons/, tests/) and over the GitHub Actions workflows themselves. Findings
# land in the repository's code scanning alerts, where they are triaged; the
# job fails only when the analysis itself fails, so this adds evidence on every
# pull request without becoming a merge gate. It is not a required check.
#
# build-mode none: neither language is compiled, so CodeQL reads the source as
# checked out and needs no install step. Shell, Helm templates and YAML outside
# .github/workflows/ are not CodeQL languages; shellcheck and the check-all.sh
# gates cover those.

name: codeql

on:
  pull_request:
  push:
    branches: [main, 'release-*']
  schedule:
    # Weekly, Tuesday 06:41 UTC: new CodeQL queries also run against a tree
    # nobody has pushed to.
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Supersede an older run on the same pull request; never cancel a run on a
  # pushed commit, which is the run that commit is scored by.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
