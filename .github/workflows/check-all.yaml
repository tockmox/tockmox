# SPDX-License-Identifier: Apache-2.0
#
# tools/check-all.sh on Linux, on every pull request (TM-1006).
#
# ci.yaml does not run check-all.sh. About two dozen gates run only through it
# (check-immutable-fields, check-upgrade-safety, check-pod-security,
# check-identity-seams, check-policy-gate and the rest: the run_gate lines in
# check-all.sh that have no step in ci.yaml), and until this workflow their only
# CI was portability-macos, which is weekly and manual (TM-1006, Jeff
# 2026-10-11). A chart-only pull request ran none of them. This is the per-PR
# home for every one, and the reason a release checkpoint no longer runs
# check-all.sh by hand: this run on the tagged commit is that check.
#
# Its own workflow, not a step in ci.yaml, for the reason portability-macos
# gives: ci.yaml's named steps are a counted, pinned surface (tools/doc-claims.txt).
#
# TOOL PINS COME FROM ci.yaml. Renovate's custom managers bump HELM_VERSION and
# KUBECONFORM_VERSION in ci.yaml only, so this file reads them (and the
# kubeconform checksum) from there at run time rather than carrying a copy that
# would drift. The Tockmox UI's packages go in a venv, as ci.yaml builds one,
# so the UI tests and the AI-node render gate run here rather than skip. Gates
# needing a tool installed nowhere here (promtool, gitleaks, the MkDocs venv)
# report SKIPPED, as on a laptop; ci.yaml runs those.
name: check-all
on:
  pull_request:
  push:
    # release-* for the same reason as ci.yaml (TM-0775): a point release is
    # tagged on a release-branch commit, and a pull_request run tests a merge
    # commit, not that one.
    branches: [main, 'release-*']

permissions:
  contents: read

concurrency:
  group: check-all-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-all-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-values-tiers and check-immutable-fields compare against the
          # previous release tag; without tags they report that half skipped.
          fetch-depth: 0

      - name: read the tool pins from ci.yaml
        shell: bash -euo pipefail {0}
        run: |
          pin() { sed -n "s/^  $1: \"\([^\"]*\)\".*/\1/p" .github/workflows/ci.yaml | head -1; }
          for k in HELM_VERSION KUBECONFORM_VERSION KUBECONFORM_SHA256; do
            v="$(pin "$k")"
            [ -n "$v" ] || { echo "::error::$k not found in ci.yaml's env block"; exit 1; }
            echo "$k=$v" >> "$GITHUB_ENV"
            echo "$k=$v"
          done

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: kubeconform, PyYAML and jq
        shell: bash -euo pipefail {0}
        run: |
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform && sudo install -m755 kubeconform /usr/local/bin/
          rm -f kubeconform kubeconform.tar.gz
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install -q pyyaml
          command -v jq >/dev/null || sudo apt-get install -y -q jq
          echo "bash:        $(bash --version | head -1)"
          echo "helm:        $(helm version --short)"
          echo "kubeconform: $(kubeconform -v)"
          echo "python:      $(python3 --version) PyYAML $(python3 -c 'import yaml; print(yaml.__version__)')"

      - name: the Tockmox UI's packages, in a venv
        shell: bash -euo pipefail {0}
        run: |
          python3 -m venv build/ui-venv
          build/ui-venv/bin/pip install -q -r tockmox-ui/requirements.txt pytest

      - name: every static gate, on Linux
        shell: bash -euo pipefail {0}
        env:
          TOCKMOX_UI_PYTHON: build/ui-venv/bin/python
        run: bash tools/check-all.sh
