# SPDX-License-Identifier: Apache-2.0
#
# tools/check-all.sh on Linux, on every pull request.
#
# ci.yaml does not run check-all.sh. About two dozen gates run only through it
# (check-immutable-fields, check-upgrade-safety, check-pod-security,
# check-identity-seams, check-policy-gate and the rest: the run_gate lines in
# check-all.sh that have no step in ci.yaml), and until this workflow their only
# CI was portability-macos, which is weekly and manual (Jeff
# 2026-10-11). A chart-only pull request ran none of them. This is the per-PR
# home for every one, and the reason a release checkpoint no longer runs
# check-all.sh by hand: this run on the tagged commit is that check.
#
# Its own workflow, not a step in ci.yaml, for the reason portability-macos
# gives: ci.yaml's named steps are a counted, pinned surface (tools/doc-claims.txt).
#
# TOOL PINS COME FROM mise.toml, through tools/toolchain.sh --pins. The
# kubeconform checksum is read from ci.yaml's env block, where it sits beside
# the copy of the version that tools/toolchain.sh --drift holds to mise.toml.
# The gates' Python packages come from tools/requirements-gates.txt, installed
# with --require-hashes into one venv that is first on PATH, so every gate
# imports exactly the locked set and nothing a runner image happens to carry.
# check-all.sh then refuses to start unless the tools on PATH match mise.toml.
# Gates needing a tool installed nowhere here (promtool, gitleaks, the MkDocs
# venv) report SKIPPED, as on a laptop; ci.yaml runs those.
#
# SPLIT AND SCOPED. The gates run on four shards at once, balanced by measured
# seconds, and a pull request runs only the gates whose declared inputs it changed (plus every gate
# that declares none; tools/gate-inputs.yaml). A push to main or release-*, the nightly schedule
# and a manual run run every gate. The job named check-all-linux, the one required check, waits for
# the shards and passes only when all of them passed and every gate was reported exactly once.
# The vendored subcharts are cached on the Chart.lock files and pip's downloads on the gates'
# lockfile; a miss is a cold run, never a different one.
name: check-all
on:
  pull_request:
  push:
    # release-* for the same reason as ci.yaml: a point release is
    # tagged on a release-branch commit, and a pull_request run tests a merge
    # commit, not that one.
    branches: [main, 'release-*']
  schedule:
    # Nightly, every gate: what catches an input a declaration in tools/gate-inputs.yaml forgot.
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # shellcheck for the advisory job below. Pinned here, not in ci.yaml,
  # because this job is the only user. The project publishes no checksum file, so
  # SHELLCHECK_SHA256 is the SHA-256 of the release asset as downloaded when the
  # pin was set; a bump that does not update it fails the download step, which
  # is the prompt to re-measure it.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"  # shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz
  CHECK_ALL_SHARDS: "4"

concurrency:
  group: check-all-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-all-shard:
    name: check-all (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Four entries, matching CHECK_ALL_SHARDS above.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-values-tiers and check-immutable-fields compare against the
          # previous release tag; without tags they report that half skipped. The
          # pull request's own change is HEAD^1..HEAD, which needs both parents.
          fetch-depth: 0
      - name: read the tool pins from mise.toml
        shell: bash -euo pipefail {0}
        run: |
          bash tools/toolchain.sh --pins | tee -a "$GITHUB_ENV"
          v="$(sed -n 's/^  KUBECONFORM_SHA256: "\([^"]*\)".*/\1/p' .github/workflows/ci.yaml | head -1)"
          [ -n "$v" ] || { echo "::error::KUBECONFORM_SHA256 not found in ci.yaml's env block"; exit 1; }
          echo "KUBECONFORM_SHA256=$v" | tee -a "$GITHUB_ENV"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: kubeconform and jq
        shell: bash -euo pipefail {0}
        run: |
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform && sudo install -m755 kubeconform /usr/local/bin/
          rm -f kubeconform kubeconform.tar.gz
          command -v jq >/dev/null || sudo apt-get install -y -q jq
      # The vendored subcharts, keyed on every Chart.lock: a hit makes helm-deps.sh offline (it checks
      # each subchart against its Chart.lock version before trusting it); a miss fetches as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: subcharts-${{ hashFiles('charts/*/Chart.lock') }}
      # pip's download cache, keyed on the gates' lockfile. --require-hashes still checks every file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-gates-${{ runner.os }}-${{ hashFiles('tools/requirements-gates.txt') }}
      - name: the gates' Python packages, from the lockfile
        shell: bash -euo pipefail {0}
        run: |
          python3 -m venv build/gates-venv
          build/gates-venv/bin/python -m pip install -q --disable-pip-version-check --require-hashes -r tools/requirements-gates.txt
          echo "$PWD/build/gates-venv/bin" >> "$GITHUB_PATH"
          echo "bash:        $(bash --version | head -1)"
          echo "helm:        $(helm version --short)"
          echo "kubeconform: $(kubeconform -v)"
          echo "python:      $(build/gates-venv/bin/python --version) PyYAML $(build/gates-venv/bin/python -c 'import yaml; print(yaml.__version__)')"
      - name: every static gate, on Linux
        shell: bash -euo pipefail {0}
        env:
          TOCKMOX_UI_PYTHON: build/gates-venv/bin/python
          CHECK_ALL_SHARD: ${{ matrix.shard }}/4
          CHECK_ALL_RESULTS: build/check-all-results-${{ matrix.shard }}.tsv
        run: |
          # A pull request's checkout is the merge commit: HEAD^1 is the base it merges into, so
          # HEAD^1..HEAD is exactly the pull request's change. Anything else runs every gate.
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            args=(--changed-from HEAD^1)
          fi
          bash tools/check-all.sh "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: check-all-results-${{ matrix.shard }}
          path: build/check-all-results-${{ matrix.shard }}.tsv
          retention-days: 14

  # The required check. Its name is what main's ruleset requires, so it stays check-all-linux.
  check-all-linux:
    needs: [check-all-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-all-results-*
          path: build/results
          merge-multiple: true
      - name: every shard passed and every gate was reported once
        shell: bash -euo pipefail {0}
        env:
          SHARDS_RESULT: ${{ needs.check-all-shard.result }}
        run: |
          bash tools/check-all.sh --list > build/gates.tsv
          rc=0
          python3 tools/gate-plan.py aggregate --list build/gates.tsv build/results/*.tsv || rc=$?
          [ "$SHARDS_RESULT" = success ] || { echo "::error::the shards finished as: $SHARDS_RESULT"; rc=1; }
          exit "$rc"

  shellcheck-advisory:
    # ADVISORY: reports what a change ADDS against
    # tools/shellcheck-baseline.txt, as warning annotations on the pull request.
    # continue-on-error keeps it from blocking a merge; it is not a check-all.sh
    # gate for the same reason. See tools/check-shellcheck.sh.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck, checksum-verified
        shell: bash -euo pipefail {0}
        run: |
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz && sudo install -m755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          rm -rf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}"
          shellcheck --version | head -2

      - name: the advisory's own selftest
        shell: bash -euo pipefail {0}
        run: bash tools/check-shellcheck.sh --selftest

      - name: new shellcheck findings against the baseline (advisory)
        shell: bash -euo pipefail {0}
        run: bash tools/check-shellcheck.sh
