# SPDX-License-Identifier: Apache-2.0
#
# THE POLICY GATE, PROVEN. Its own workflow rather than a ci.yaml step
# because it installs and runs a real LiteLLM proxy, which ci.yaml's static
# gates deliberately do not, and because a failure here should read as "the
# sovereignty claim broke", not as one red line among forty.
#
#   tools/check-policy-gate.sh   the config invariant (REQ-0003 AC-3.2), on the
#                                render: fifteen bad configs refused by name
#   tests/policy-gate/run.sh     the forced failure (REQ-0002 AC-2.2): the local
#                                backend killed, a restricted request with a
#                                client fallback to an external model, and
#                                nothing reaching the external backend
#   tests/key-policy/            the key policy: unit tests, then a
#                                real proxy and database refusing every bad
#                                key write, and the same writes allowed with
#                                the policy unregistered (the red leg)
#
# LiteLLM is installed at the version the chart vendors, read from the vendored
# chart, so the test always runs the gate in the proxy that ships it.
name: policy-gate
on:
  pull_request:
  push:
    branches: [main, 'release-*']

# A newer push to a pull request cancels its older run; pushes to main, release-* and tags
# always run to the end (the same rule as check-all.yaml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: read the tool pins from mise.toml
        # One source for every tool version (mise.toml); tools/toolchain.sh --drift
        # refuses a workflow that carries its own copy.
        shell: bash -euo pipefail {0}
        run: bash tools/toolchain.sh --pins | tee -a "$GITHUB_ENV"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # Subcharts keyed on every Chart.lock: a hit makes helm-deps.sh offline.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: charts/*/charts
          key: subcharts-${{ hashFiles('charts/*/Chart.lock') }}
      - name: vendored chart dependencies
        run: bash tools/helm-deps.sh
      - name: the config invariant refuses every bad config by name
        run: bash tools/check-policy-gate.sh
      # The LiteLLM venv, keyed on the ai layer's Chart.lock (which moves with the vendored
      # LiteLLM) and the runner's Python. The install step below still checks the version it finds.
      - id: py
        run: echo "v=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/litellm
          key: litellm-venv-${{ runner.os }}-py${{ steps.py.outputs.v }}-${{ hashFiles('charts/tockmox-ai/Chart.lock') }}
      - name: install LiteLLM at the vendored version
        run: |
          ver="$(helm show chart charts/tockmox-ai/charts/litellm-helm-*.tgz | sed -n 's/^appVersion: *//p' | tr -d '"')"
          test -n "$ver" || { echo "::error::could not read the vendored LiteLLM appVersion"; exit 1; }
          have="$("$RUNNER_TEMP/litellm/bin/python" -c 'import importlib.metadata as m; print(m.version("litellm"))' 2>/dev/null || true)"
          if [ "$have" = "$ver" ]; then
            echo "LiteLLM ${ver}, from the cached venv"
          else
            rm -rf "$RUNNER_TEMP/litellm"
            python3 -m venv "$RUNNER_TEMP/litellm"
            "$RUNNER_TEMP/litellm/bin/pip" install --quiet "litellm[proxy]==${ver}"
            echo "LiteLLM ${ver}"
          fi
          echo "LITELLM_BIN=$RUNNER_TEMP/litellm/bin/litellm" >> "$GITHUB_ENV"
      - name: the forced failure - local backend down, nothing reaches external
        run: bash tests/policy-gate/run.sh
      # The key policy's unit tests, then the same LiteLLM with a real Postgres (the runner image's own
      # binaries, under /usr/lib/postgresql) and its red leg: the policy unregistered, the same writes succeed.
      - name: the key policy - unit tests
        run: |
          "$RUNNER_TEMP/litellm/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/litellm/bin/python" -m pytest -q tests/key-policy/test_key_policy.py
      - name: the key policy - the prisma client
        # litellm[proxy] does not install the prisma client (only litellm's extra-proxy extra does); pinned to the
        # version the local proof ran with, inside litellm's own range (>=0.11.0,<1.0). Its own step so its seconds
        # show apart from the proxy test's: the two together were one 228 s median step.
        run: |
          "$RUNNER_TEMP/litellm/bin/pip" install --quiet "prisma==0.15.0"
          proxy_dir="$("$RUNNER_TEMP/litellm/bin/python" -c 'import litellm, os; print(os.path.join(os.path.dirname(litellm.__file__), "proxy"))')"
          (cd "$proxy_dir" && PATH="$RUNNER_TEMP/litellm/bin:$PATH" "$RUNNER_TEMP/litellm/bin/prisma" generate --schema schema.prisma >/dev/null)
      - name: the key policy - every bad key write refused by a real proxy, and allowed without it
        run: bash tests/key-policy/run.sh
