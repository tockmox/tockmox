#
# Ingress for the Longhorn console ... OFF by default; see values.yaml for the
# reasoning. The upstream Service is literally named `longhorn-frontend`
# (not release-prefixed). Sync wave 8: after the Traefik Service (wave 7) that
# gives an Ingress its address; see garage-web.yaml and the helper's `wave`.
{{- if and .Values.apps.longhorn.enabled .Values.ingress.apps.longhorn.enabled }}
---
{{ include "tockmox.ingress" (dict "ctx" . "name" "longhorn" "prefix" "longhorn" "host" .Values.ingress.apps.longhorn.host "service" "longhorn-frontend" "port" 80 "wave" "8" "annotations" (include "tockmox.forwardAuthAnnotations" (dict "ctx" $ "app" "longhorn" "on" .Values.ingress.apps.longhorn.forwardAuth) | fromYaml)) }}
{{- end }}
{{- /*
THE TRAEFIK DASHBOARD AT A HOST-MATCHED NAME, BEHIND AUTHENTIK (TM-0217, TM-0425).

The upstream chart's own dashboard route matches PathPrefix(/dashboard) and
PathPrefix(/api) with no Host rule and no auth, so it answers on every internal
hostname and `/api` exposes router and service config: `traefik.ingressRoute.
dashboard.enabled` stays false. This route is the replacement: one Host, the
dashboard and its API only, and Authentik in front unless
`ingress.apps.traefik.forwardAuth: false`.

An IngressRoute rather than an Ingress, because the backend is Traefik's own
`api@internal` TraefikService, which an Ingress cannot name. So it carries its
own Certificate (an Ingress gets one from the cert-manager annotation; an
IngressRoute does not) when global.certIssuer is set, and the forward-auth
Middleware by its provider-qualified name.

The port-forward path (`traefik.api.insecure`) is NOT replaced: a console that
tells you why routing is broken should not be reachable only through the
routing you are debugging, and an Authentik outage would otherwise lock you out
of the tool you would use to find it.
*/ -}}
{{- $tr := .Values.ingress.apps.traefik | default dict }}
{{- if and (include "tockmox.appEnabled" (dict "ctx" $ "app" "traefik")) $tr.enabled }}
{{- $host := $tr.host | default (include "tockmox.internalHost" (dict "svc" "traefik" "ctx" $)) }}
{{- $fa := include "tockmox.forwardAuthAnnotations" (dict "ctx" $ "app" "traefik" "on" $tr.forwardAuth) | fromYaml }}
{{- if .Values.global.certIssuer }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: {{ .Values.global.certIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ $host }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  entryPoints:
    - {{ ternary "websecure" "web" (ne .Values.global.certIssuer "") }}
  routes:
    - match: Host(`{{ $host }}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      {{- with $fa }}
      middlewares:
        - name: {{ index . "traefik.ingress.kubernetes.io/router.middlewares" }}
      {{- end }}
    # The bare host redirects to the dashboard, so the portal tile can launch it.
    - match: Host(`{{ $host }}`) && Path(`/`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: traefik-dashboard-root
      {{- with $fa }}
        - name: {{ index . "traefik.ingress.kubernetes.io/router.middlewares" }}
      {{- end }}
  {{- if .Values.global.certIssuer }}
  tls:
    secretName: traefik-dashboard-tls
  {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-root
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/?$
    replacement: ${1}/dashboard/
{{- end }}
