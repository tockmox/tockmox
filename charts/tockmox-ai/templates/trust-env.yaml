{{- /*
SPDX-License-Identifier: Apache-2.0

WHETHER A CA IS COMING, FOR THE OPEN WEBUI TRUST BUNDLE (TM-1053).

The `tockmox-trust-bundle` initContainer waits up to 300 seconds for the Tockmox
CA when TOCKMOX_EXPECT_CA is "true", and builds the bundle at once without it
when the variable is unset. Open WebUI's HTTP clients read the bundle once, so a
bundle built before the CA lands is wrong for the life of the pod (TM-0632).

Until 0.9.0 the variable arrived only through the SSO Secret (sso-env.yaml),
which does not render while sso.enabled is false. A site with certIssuer set and
SSO off therefore got the unset case, and the homelab fixed it by restating the
whole initContainer in its own values, with the image named in it. That restated
image had to equal the application image (templates/preflight.yaml), so every
Open WebUI bump was a second pull request in the site repo.

This ConfigMap carries the variable on its own, whatever SSO does, and the
initContainer reads it through an optional envFrom. A site no longer has a
reason to restate the container, so an Open WebUI bump reaches it with no site
edit.

The value follows global.certIssuer, which is when a CA is coming at all, and
modelGateway.trustBundle.expectCA overrides it for the two sites the derivation
gets wrong: a CA that arrives with no global.certIssuer (the Ingress certificate
comes from an issuer the site manages itself), and a certIssuer whose Ingress
certificate will never carry a ca.crt.

The ConfigMap is read after the SSO Secret in the initContainer's envFrom, and a
later source wins, so the override also wins over the Secret's own copy of the
key (which stays, for a site that still restates the container with only the
Secret in its envFrom).

A pod does not roll when a ConfigMap it reads through envFrom changes.
global.certIssuer is covered by TOCKMOX_SSO_ENV_REVISION; the override is not,
because a subchart cannot read it. Restart Open WebUI after changing it.
*/ -}}
{{- if include "tockmox.appEnabled" (dict "ctx" $ "app" "openWebui") }}
{{- $tb := (.Values.modelGateway | default dict).trustBundle | default dict -}}
{{- $expect := ne (.Values.global.certIssuer | default "") "" -}}
{{- if kindIs "bool" $tb.expectCA }}{{- $expect = $tb.expectCA }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tockmox-ai-trust-env
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
data:
  TOCKMOX_EXPECT_CA: {{ ternary "true" "false" $expect | quote }}
{{- end }}
