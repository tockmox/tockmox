{{- /*
The LiteLLM schema migrations Job, owned by this chart rather than the
litellm-helm subchart (TM-0596, ruled 2026-10-06).

WHY THIS CHART OWNS IT. A Job's `spec.template` is immutable once the Job
exists. The subchart names its Job `<fullname>-migrations` whatever the
template holds, so ANY change to the pod template ... a volume, a security
context, or simply a LiteLLM image bump ... wedges every existing site on
upgrade: ArgoCD reports `field is immutable`, retries five times and stops,
and the layer sits OutOfSync with the operation Failed. 0.7.0 shipped with an
operator step for exactly this, and every later bump would have needed
another. Worse, on an image bump the new schema migrations would never run
until someone deleted the Job by hand.

So the Job here is NAMED AFTER ITS OWN POD TEMPLATE: the suffix is a hash of
the rendered template below. Same template, same name, and applying it again is
a no-op. A different template is a different Job: ArgoCD creates it, the
migration runs (`prisma migrate deploy` is idempotent: on an unchanged schema
it applies nothing), and the previous Job is no longer in desired state, so an
Application with `prune` (the generated site repo's default) deletes it. A site
that syncs by hand without prune keeps the old, Completed Job until it prunes;
it is inert.

The pod template is the subchart's own, reproduced with the subchart's context
(`.Subcharts.litellm`), so it reads the same values, the same defaults and the
same helpers. `tools/check-upgrade-safety.sh` F1 proves the name moves with the
template and with nothing else, and F1b compares this pod spec with the one
the vendored subchart would render, so an upstream change to its Job on a
LiteLLM bump goes red here instead of being silently missed.

The subchart's own Job is OFF (`litellm.migrationJob.enabled: false`); turning
it back on would render two Jobs migrating one database, so that refuses.
*/ -}}
{{- if and (include "tockmox.appEnabled" (dict "ctx" $ "app" "litellm")) (hasKey .Subcharts "litellm") }}
{{- $sub := index .Subcharts "litellm" -}}
{{- $mj := $sub.Values.migrationJob -}}
{{- if $mj.enabled -}}
{{- fail "litellm.migrationJob.enabled is true, which renders the subchart's own migrations Job beside the one tockmox-ai owns (templates/litellm-migrations-job.yaml), and two Jobs would migrate one database. Leave it false; the Tockmox Job reads litellm.migrationJob's backoffLimit, activeDeadlineSeconds, ttlSecondsAfterFinished, resources and annotations." -}}
{{- end -}}
{{- $pod := include "tockmox-ai.litellmMigrationsPod" $sub -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "litellm.fullname" $sub }}-migrations-{{ $pod | sha256sum | trunc 10 }}
  labels:
    {{- include "litellm.labels" $sub | nindent 4 }}
    app.kubernetes.io/component: migrations
spec:
  template:
    {{- $pod | nindent 4 }}
  {{- with $mj.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  backoffLimit: {{ $mj.backoffLimit }}
  {{- with $mj.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
{{- end }}
