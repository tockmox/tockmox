{{- /*
SPDX-License-Identifier: Apache-2.0

Environment the model gateway gets only on an air-gapped site.

Rendered when the gateway is enabled and `global.imageRegistry` is set. The
proxy and its migrations Job read it through the optional configMapKeyRef in
the shipped `litellm.extraEnvVars` (values.yaml says why it is a reference and
not a value). With global.imageRegistry empty this renders nothing, the
reference resolves to nothing, and LiteLLM keeps its live price-map fetch.

THE NAME IS FIXED, not derived from the release name, for the same reason as
`tockmox-litellm-hooks`: the subchart takes extraEnvVars as literal values.
*/ -}}
{{- if and (include "tockmox.appEnabled" (dict "ctx" $ "app" "litellm")) .Values.global.imageRegistry }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tockmox-litellm-airgap-env
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
data:
  # Use the price map bundled in the image instead of fetching it from
  # raw.githubusercontent.com at start.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
{{- end }}
