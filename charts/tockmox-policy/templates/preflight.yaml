SPDX-License-Identifier: Apache-2.0

Render-time guards for this layer. Emits no objects.
*/ -}}
{{- /*
CAPABILITY COHERENCE. A component switched on individually while the capability
that owns it is off leaves a part with no whole. Failing beats delivering half,
and beats silently promoting the capability back on because of one key.
*/ -}}
{{- /*
This list is the THIRD place the networkPolicy component set is written down,
after tockmox.capabilityOwners in tockmox-common and the OWNERS map in
tools/check-capabilities.sh. The gate asserts those two agree with each other;
nothing asserts this one, so a component added to the owners map and forgotten
here gets no coherence guard and the gate catches it only because it tests the
guard's behaviour directly. Deriving this list from the owners map is a 0.7.0
cleanup ... see the roadmap.
*/ -}}
{{- include "tockmox.capabilityCoherent" (dict "ctx" $ "capability" "networkPolicy" "apps" (list "ai_namespace" "ai_cnpg_netpol" "ai_openwebui_egress" "authentik_netpol" "devops_netpol" "forgejo_netpol" "harbor_netpol" "monitoring_netpol" "platform_netpol" "selfcheck_netpol" "syslog_ingest_netpol" "tailscale_netpol")) -}}
{{- /*
`serviceMonitors` is deliberately NOT guarded here (TM-0825). Declining the
observability capability while pinning `apps.serviceMonitors.enabled: true` is
the documented "run your own Prometheus operator" route: the capability says
"do not deploy a monitoring stack", the component says "but render the monitors
and rules for the operator I already have". Refusing it made the route
unreachable in every layer.
*/ -}}
