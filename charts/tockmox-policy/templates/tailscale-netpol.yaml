{{- if include "tockmox.capabilityEnabled" (dict "ctx" $ "capability" "networkPolicy" "app" "tailscale_netpol") }}
{{- if not .Values.namespaces.tailscale }}
{{- fail "\n\napps.tailscale_netpol.enabled is true but namespaces.tailscale is blank.\nSet it to the namespace your Tailscale operator or subnet router runs in,\nand add `tailscale` to namespaces.create if you want this chart to create it.\n" }}
{{- end }}
# SPDX-License-Identifier: Apache-2.0
---
# SITE-SUPPLIED. Tockmox ships no Tailscale operator or subnet router. This
# bundle is off by default and exists for operators who install one themselves;
# the reasoning below is why it is safe to default-deny that namespace at all.
#
# Default-deny INGRESS for the tailscale namespace (egress untouched).
#
# SAFETY REASONING (this is the namespace that bridges off-LAN access):
#  - The subnet-router pod's DATA PATH is the Tailscale tunnel (its tailscale0
#    interface), NOT the cluster pod network. Off-LAN clients reaching cluster
#    targets arrive over the tunnel and are FORWARDED by the router as EGRESS.
#    An ingress-only default-deny touches neither, so off-LAN reachability
#    (including the advertised LAN route) is unaffected.
#  - The operator reconciles via the kube-apiserver (egress). Nothing on the
#    pod network needs to initiate INTO these pods except metrics scraping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
  name: default-deny-ingress
  namespace: {{ .Values.namespaces.tailscale }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Intra-namespace: covers any operator <-> subnet-router pod-network chatter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
  name: allow-intra-namespace
  namespace: {{ .Values.namespaces.tailscale }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.tailscale }}
---
# Prometheus (monitoring) -> tailscale metrics. Future-proofs the operator /
# router metrics endpoints (same posture as the harbor allow-prometheus-scrape)
# without reopening the namespace later.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
  name: allow-prometheus-scrape
  namespace: {{ .Values.namespaces.tailscale }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.monitoring }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
{{- end }}
