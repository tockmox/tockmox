{{- /*
SPDX-License-Identifier: Apache-2.0

Render-time guards for this layer. Emits no objects.
*/ -}}
{{- /*
CAPABILITY COHERENCE. A component switched on individually while the capability
that owns it is off leaves a part with no whole. Failing beats delivering half,
and beats silently promoting the capability back on because of one key.
*/ -}}
{{- include "tockmox.capabilityCoherent" (dict "ctx" $ "capability" "observability" "apps" (list "blackbox")) -}}
{{- include "tockmox.capabilityCoherent" (dict "ctx" $ "capability" "hardwareTelemetry" "apps" (list "snmp" "smartctl")) -}}
{{- /*
Exporters with nothing collecting from them are the purest form of the failure
this repo keeps finding: objects that apply cleanly, run healthy, and are never
read. Either the stack is here, or you told us your own operator is.
*/ -}}
{{- include "tockmox.capabilityRequires" (dict "ctx" $ "capability" "hardwareTelemetry"
    "satisfiedBy" (list "observability") "apps" (list "serviceMonitors")
    "because" "nothing is set up to collect from the exporters it deploys, so they would run and be scraped by no one.") -}}
