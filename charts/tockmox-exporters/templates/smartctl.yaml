{{- /*
SPDX-License-Identifier: Apache-2.0

THE SMART EXPORTER, OWNED HERE RATHER THAN VENDORED (TM-0799).

It reads every disk on the node: a privileged container with the host's /dev mounted. The
Pod Security Standards refuse that at every level below privileged, so it cannot share a
namespace with pods that should be held to baseline. It runs in `namespaces.nodeAgents`,
the namespace the policy layer labels `enforce: privileged`.

Why this is a template and not the upstream subchart (prometheus-smartctl-exporter 0.17.1,
which this replaces). A subchart renders into the release's namespace and most of its objects
carry no namespace of their own, so Argo CD places them in the Application's destination,
the monitoring namespace. This chart installs as ONE Application and the installer gives an
Application ONE destination; the subchart has no `namespaceOverride`. So the only way to put
this DaemonSet elsewhere without a second Application was to render it from here, with an
explicit namespace on every object. The kube-bench Job in tockmox-selfcheck is the same shape.

What carried over from the upstream chart, so a site's values keep working: the object names
(`<release>-prometheus-smartctl-exporter`, DaemonSet suffixed `-<n>` per instance), the labels,
and every key under `prometheus-smartctl-exporter:` (image, config, common.config,
extraInstances, extraArgs, resources, tolerations, nodeSelector, affinity, hostNetwork,
priorityClassName, annotations, podAnnotations, podLabels, updateStrategy, service,
serviceAccount, serviceMonitor, prometheusRules). What did not: `rbac`, which bound the
ServiceAccount to a PodSecurityPolicy ClusterRole that no supported Kubernetes has had since
1.25, and `nameOverride` and `fullnameOverride`.

What the image field adds: `global.imageRegistry` now redirects it (the upstream chart had no
such key, and its `- image:` list form was invisible to tools/lib/extract-images.sh, so the
image was in neither images.txt nor the air-gap gate).

Renovate: the helm-values manager reads `image.repository` and `image.tag` below.
*/ -}}
{{- if include "tockmox.appEnabled" (dict "ctx" $ "app" "smartctl") -}}
{{- $v := index .Values "prometheus-smartctl-exporter" -}}
{{- $ns := required "namespaces.nodeAgents is empty, and the SMART exporter has to run in a namespace the policy layer labels privileged. Name it (default tockmox-node-agents), together with namespaces.node_agents in tockmox-policy." .Values.namespaces.nodeAgents -}}
{{- $name := "prometheus-smartctl-exporter" -}}
{{- $full := printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- if contains $name .Release.Name -}}{{- $full = .Release.Name | trunc 63 | trimSuffix "-" -}}{{- end -}}
{{- $sa := $full -}}
{{- if $v.serviceAccount.create -}}{{- $sa = default $full $v.serviceAccount.name -}}{{- else -}}{{- $sa = default "default" $v.serviceAccount.name -}}{{- end -}}
{{- $sel := dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name -}}
{{- $labels := merge (dict "helm.sh/chart" (printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-") "app.kubernetes.io/version" $v.image.tag "app.kubernetes.io/managed-by" .Release.Service) $sel -}}
{{- $repo := $v.image.repository -}}
{{- if .Values.global.imageRegistry -}}
{{- $repo = printf "%s/%s" (trimSuffix "/" .Values.global.imageRegistry) (regexReplaceAll "^[^/]*[.:][^/]*/" $v.image.repository "") -}}
{{- end -}}
{{- if $v.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- with $v.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  {{- if $v.service.ipDualStack.enabled }}
  ipFamilies: {{ toYaml $v.service.ipDualStack.ipFamilies | nindent 4 }}
  ipFamilyPolicy: {{ $v.service.ipDualStack.ipFamilyPolicy }}
  {{- end }}
  ports:
    - port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- toYaml $sel | nindent 4 }}
{{- $base := dict "annotations" $v.annotations "resources" $v.resources "nodeSelector" $v.nodeSelector "affinity" $v.affinity "tolerations" $v.tolerations "config" $v.config "hostNetwork" $v.hostNetwork "priorityClassName" $v.priorityClassName "extraArgs" $v.extraArgs }}
{{- $items := prepend $v.extraInstances $base }}
{{- range $idx, $item := $items }}
{{- /* An extra instance inherits what it does not set, where the upstream chart rendered `resources: null`. The common block is the DEFAULT for config and an instance's own config wins, where upstream let the common block overwrite it. */ -}}
{{- $item = mergeOverwrite (deepCopy $base) (deepCopy $item) }}
{{- $config := mergeOverwrite (deepCopy $v.common.config) ($item.config | default dict) }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $full }}-{{ $idx }}
  namespace: {{ $ns }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- toYaml $labels | nindent 4 }}
    idx: i{{ $idx }}
spec:
  {{- with $v.updateStrategy }}
  updateStrategy: {{ toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      idx: i{{ $idx }}
  template:
    metadata:
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- toYaml $sel | nindent 8 }}
        idx: i{{ $idx }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $v.image.pullSecrets }}
      imagePullSecrets:
        {{- range $secret := $v.image.pullSecrets }}
        - name: {{ $secret }}
        {{- end }}
      {{- end }}
      containers:
        - name: main
          image: {{ printf "%s:%s" $repo $v.image.tag | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - '--smartctl.path={{ $config.smartctl_location }}'
            - '--smartctl.interval={{ $config.collect_not_more_than_period }}'
            {{- if $config.device_exclude }}
            - '--smartctl.device-exclude={{ $config.device_exclude }}'
            {{- end }}
            {{- if $config.device_include }}
            - '--smartctl.device-include={{ $config.device_include }}'
            {{- end }}
            {{- range $config.devices }}
            - '--smartctl.device={{ . }}'
            {{- end }}
            - '--web.listen-address={{ $config.bind_to }}'
            - '--web.telemetry-path={{ $config.url_path }}'
            {{- range $key, $value := $item.extraArgs }}
            - '--{{ $key }}={{ $value }}'
            {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: http
              containerPort: 9633
              protocol: TCP
          resources:
            {{- toYaml $item.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /hostdev
              name: dev
      dnsPolicy: ClusterFirst
      hostNetwork: {{ $item.hostNetwork }}
      {{- if $item.priorityClassName }}
      priorityClassName: {{ $item.priorityClassName }}
      {{- end }}
      restartPolicy: Always
      serviceAccountName: {{ $sa }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
      {{- with $item.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $item.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $item.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if $v.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $full }}
  namespace: {{ $v.serviceMonitor.namespace | default $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
    {{- with $v.serviceMonitor.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $v.serviceMonitor.attachMetadata }}
  attachMetadata:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  endpoints:
    - interval: {{ $v.serviceMonitor.interval }}
      path: /metrics
      port: http
      scheme: http
      scrapeTimeout: {{ $v.serviceMonitor.scrapeTimeout }}
      {{- with $v.serviceMonitor.relabelings }}
      relabelings: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.serviceMonitor.metricRelabelings }}
      metricRelabelings: {{ toYaml . | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ $ns }}
  selector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
{{- end }}
{{- if $v.prometheusRules.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $full }}.rules
  namespace: {{ $v.prometheusRules.namespace | default $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
    {{- with $v.prometheusRules.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ $name }}
      rules:
        {{- range $v.prometheusRules.rules }}
        {{- if .enabled }}
        - alert: {{ .alert | required "A rule requires a valid `alert` clause" }}
          expr: {{ .expr | required "A rule requires a valid `expr` clause" }}
          {{- with .for }}
          for: {{ . }}
          {{- end }}
          {{- with .keep_firing_for }}
          keep_firing_for: {{ . }}
          {{- end }}
          {{- with .annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .labels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
