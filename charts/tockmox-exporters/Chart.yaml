# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: tockmox-exporters
description: "Hardware and service exporters. Disable wholesale if your hardware differs."
type: application
version: 0.8.0
appVersion: "0.1.0"
annotations:
  tockmox.com/sync-wave: "3"
dependencies:
  - name: tockmox-common
    version: 0.8.0
    repository: "file://../tockmox-common"
  - name: prometheus-blackbox-exporter
    version: 11.20.2
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: apps.blackbox.enabled,capabilities.observability.enabled
  - name: prometheus-snmp-exporter
    version: 9.18.2
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: apps.snmp.enabled,capabilities.hardwareTelemetry.enabled
