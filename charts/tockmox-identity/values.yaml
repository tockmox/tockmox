# SPDX-License-Identifier: Apache-2.0
global:
  internalDomain: ""
  certIssuer: "tockmox-ca"
  imageRegistry: ""
  timezone: "UTC"
  clusterCIDR: "10.42.0.0/16"
  serviceCIDR: "10.43.0.0/16"
  lanCIDR: ""
  # THE STORAGE CONTRACT. Empty means "use whatever the cluster's default
  # StorageClass happens to be", which is not the same as "use the storage this
  # platform ships". On k3s the default is `local-path`: node-local, one copy,
  # no snapshots, no backup target. Tockmox shipped Longhorn and, because
  # nothing named a class, wrote every PVC to local-path anyway.
  #
  # Name it. `longhorn` on a stock install with apps.longhorn enabled;
  # `local-path` if you have deliberately chosen node-local storage; the name of
  # your own CSI class if you brought one. A preflight refuses the combination
  # that used to fail silently.
  storageClass: ""

  # THE SECOND HALF OF THE STORAGE CONTRACT: the class for data whose
  # application already protects it, or that can be re-derived.
  #
  # The policy is "replicate at exactly one layer". If an application keeps its
  # own copies (Postgres streaming to replicas, an object store spreading
  # across nodes) or the data can be rebuilt (a metrics TSDB), then replicating
  # the volume underneath buys nothing and costs two to three times the disk
  # plus write latency on the hot path. Those workloads get THIS class.
  # Everything else gets `storageClass` above.
  #
  # `local-path` is k3s's own provisioner and is the shipped default here.
  # prerequisites.md tells you to UN-DEFAULT it rather than delete it, and this
  # is why. Node-local means a rescheduled pod finds an empty volume, which is
  # the trade this class exists to make; do not point it at anything whose loss
  # you would mind.
  #
  # Empty falls back to the cluster default, which un-does the policy without
  # complaining. Set it to a class you have.
  localStorageClass: "local-path"

  # THE RESILIENT CLAIM (TM-0597). Empty makes no claim. `resilient`, set by
  # profiles/resilient.yaml, says "this install is resilient": the layers that
  # have a backup then REFUSE to render while the backup is off or points inside
  # the cluster, and raise an alert while no restore drill has passed. Leave it
  # empty unless the backup target is outside the cluster. What it checks and
  # what it cannot is docs/deployment/profiles.md, "The resilient profile".
  # Tier: provisional (ruled 2026-10-29, again by 0.10.0).
  #
  # DELIBERATELY NOT DECLARED HERE. An empty default would still be a change to
  # `.Values`, and the vendored litellm chart hashes its whole values tree into
  # the migrations Job's annotation, so declaring the key would roll that Job
  # on every upgrade of every install that never heard of this profile. Unset
  # and "" mean the same thing; the schema (values.schema.json) is where the key
  # is declared.
  #
  # resilience:
  #   profile: resilient     # set by profiles/resilient.yaml, not by hand
# ---------------------------------------------------------------------------
# CAPABILITIES: functional stories you can decline.
#
# `apps.*` is one switch per piece of software, which is the wrong unit for the
# decision people actually make. Nobody chooses "a Garage", "a barman plugin"
# and "a snapshot controller" separately; they choose whether this deployment
# protects its data, or whether they already run Velero and want none of it.
#
# A capability is that decision, named, on one switch, spanning whatever
# components it takes and whichever layers they live in.
#
# HOW IT RESOLVES, and the tri-state is the point:
#   apps.<x>.enabled unset   follow the capability that owns the component
#   apps.<x>.enabled: true   on, even if the capability is off
#   apps.<x>.enabled: false  off, even if the capability is on
#
# So declining a capability turns off everything it owns, and a component you
# named yourself still means what you said. Turning a single component on while
# its capability is off fails the render rather than half-building the story.
#
# THIS BLOCK IS BYTE-IDENTICAL IN ALL NINE LAYERS, and that is deliberate. The
# values namespace is shared across layers, so one profile sets a capability
# once and every layer owning part of it reads the same answer. Editing one copy
# and not the others is the failure the uniformity exists to prevent, and
# tools/check-capabilities.sh fails CI on any drift between them.
#
# Full list, what each one contains, and why you would decline it:
# docs/administration/capabilities.md
# ---------------------------------------------------------------------------
capabilities:
  # Metrics, logs and the rules that read them ... everything answering "what is
  # this platform doing right now". Off means Tockmox ships no Prometheus, no
  # Loki, no Alloy, and none of its own ServiceMonitors or alert rules.
  #
  # Running your own Prometheus operator is the case worth naming. Decline the
  # capability and set `apps.serviceMonitors.enabled: true`, and Tockmox renders
  # its monitors and rules for YOUR operator to collect, without standing up a
  # second stack beside the one you already run.
  observability:
    enabled: true

  # Alerts that reach a person: the notification sink, the bridge that feeds it
  # and the heartbeat that proves the path still works when nothing is wrong.
  # Off means alerts fire into Alertmanager and stop there.
  #
  # The component switch for this one is `notifications.enabled` rather than an
  # `apps` key, because it predates this framework and is a contract key. It has
  # the same tri-state: unset follows the capability, set means what you said.
  notifications:
    enabled: true

  # One sign-in across every console, and the identity provider behind it. Off
  # means Tockmox ships no Authentik and each console falls back to its own
  # local login, unless you point `sso` at an issuer you already run.
  identity:
    enabled: true

  # The private AI plane: a chat console and the model gateway in front of it.
  # Off leaves Tockmox as a platform and nothing else, which is a legitimate way
  # to run it and the right answer if you are here for the infrastructure.
  aiPlane:
    enabled: true

  # Backups that go somewhere, restores that are exercised, and the CSI
  # plumbing underneath both. Off means Tockmox ships no object store, no
  # backup plugin and no snapshot control plane, and expects you to have your
  # own or to not want one.
  dataProtection:
    enabled: true

  # Telemetry from PHYSICAL hardware: disk SMART attributes, and SNMP from
  # switches, UPSes and appliances.
  #
  # OFF BY DEFAULT, unlike every other capability here, because the reference
  # deployment is a virtual machine: there is no physical disk to ask and no
  # switch to poll, and an exporter scraping nothing still alerts on its own
  # absence. Turn it on when the hardware is real, and both exporters follow.
  hardwareTelemetry:
    enabled: false

  # Jobs running inside the cluster on a schedule or an event, with a console to
  # watch them. Off means no Argo Workflows.
  workflowAutomation:
    enabled: true

  # Default-deny between namespaces, so a compromised workload cannot reach a
  # neighbour it was never meant to.
  #
  # Off is the honest setting on a cluster whose CNI does not enforce
  # NetworkPolicy at all. Flannel without a policy plugin accepts every object
  # here and enforces none of them, and a control that is only decoration is
  # worse than no control, because it gets counted.
  networkPolicy:
    enabled: true

namespaces:
  identity: tockmox-authentik

# ---------------------------------------------------------------------------
# The way in. `auth.<internalDomain>` by default; global.certIssuer adds TLS.
# The upstream chart's own `authentik.server.ingress` stays off: its host is a
# static string, and Tockmox derives hostnames from one place.
# ---------------------------------------------------------------------------
ingress:
  # Empty uses the cluster's DEFAULT IngressClass ... the Traefik the platform
  # layer ships marks itself default, and its class name derives from the
  # release (`tockmox-platform-traefik` on a stock install), so naming it here
  # would break on rename. Set this only to pin a specific class.
  className: ""
  annotations: {}
  apps:
    authentik:
      enabled: true
      host: ""            # override the derived auth.<internalDomain>

apps:
  authentik: {}   # unset: follows capabilities.identity

# ---------------------------------------------------------------------------
# BRANDING ... the login page and the application tiles.
#
# A tiny nginx serving the Tockmox marks from a ConfigMap at /tockmox on the
# Authentik host, plus a blueprint pointing Authentik's branding fields at it.
# Nothing is fetched from the internet: a login page that loads its logo from a
# CDN is a login page that looks broken on an air-gapped install.
#
# REPLACING THE MARKS. "Tockmox" and the Tockmox logo are trademarks
# (TRADEMARKS.md): a modified distribution must not identify itself as Tockmox.
# Swap the SVGs in charts/tockmox-identity/brand/ for your own and set `title`,
# or set enabled: false for stock Authentik branding.
# ---------------------------------------------------------------------------
brand:
  enabled: true
  title: Tockmox
  # The UNPRIVILEGED nginx, not the stock one. Stock nginx starts as root to
  # chown its temp directories and then drops; under runAsNonRoot with a
  # read-only root it fails during startup with a permission error that names a
  # path, not a cause. This variant listens on 8080 as UID 101 by design, and
  # the observability layer already pulls the same image family.
  image: nginxinc/nginx-unprivileged:1.31-alpine
  priorityClassName: tockmox-apps
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

# ---------------------------------------------------------------------------
# SINGLE SIGN-ON ... on by default. Enabling the identity layer means the
# other consoles use it.
#
# This chart ships Authentik BLUEPRINTS declaring an OAuth2 provider and an
# Application per shipped UI, with redirect URIs derived from
# global.internalDomain, plus two groups every app's role mapping keys on:
#   tockmox-admins  -> Grafana Admin, Open WebUI admin, Argo admin
#   tockmox-users   -> Grafana Viewer, Open WebUI user, Argo read-only
#
# Client secrets NEVER appear in values or blueprints. Blueprints read them
# with !Env from the `tockmox-sso` Secret you create (see
# docs/administration/secrets.md); each consuming app reads ITS copy from its
# own per-app Secret. Until the secrets exist, Authentik runs with the
# blueprints unresolved and the consoles keep their local logins ... loud in
# the blueprint status, nothing crashes.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE BUNDLED SERVER'S BACKUP, the pg_dump bridge. Authentik's bundled
# (Bitnami) Postgres has no CNPG underneath and therefore no Barman path, so
# this nightly pg_dump to the shipped object store is its backup.
# Seven-object weekday rotation ... self-pruning, fixed ceiling, seven-day
# restore window, stated plainly. Requires the platform layer's Garage
# bootstrap to have copied `tockmox-garage-credentials` into this namespace
# (it does by default). Needs dataProtection on; follows it off. Restore:
# gunzip < dump | psql, per backup-restore.md.
#
# RENDERED ONLY WHILE THE BUNDLED SERVER IS ON (`authentik.postgresql.enabled`,
# TM-0788). A fresh 0.9.0 install runs Authentik on the CNPG cluster under
# `identity` below, which archives WAL and drills its restores, and gets no
# bridge. An install that keeps the bundled server keeps the bridge with it.
# ---------------------------------------------------------------------------
databaseBackup:
  enabled: true
  # Five-field Kubernetes cron. 03:10, between the reference site's other
  # nightly jobs so one small Garage is not absorbing three streams at once.
  schedule: "10 3 * * *"
  suspend: false
  endpoint: http://tockmox-garage.tockmox-platform.svc:3900
  bucket: tockmox-backups
  # THE pg_dump CLIENT, and it has to track the SERVER the authentik subchart
  # runs. These are two independent pins: the server tag comes from whatever
  # authentik's vendored postgresql subchart happens to ship, and this one is
  # ours. They drifted apart on the 2026-09-12 bump to authentik 2026.8.2 ...
  # server went to 17.11, this stayed at 17.10, and images.txt grew a second
  # postgres line, which is how it was noticed at all.
  #
  # A patch-level gap is harmless. A MAJOR gap is not: pg_dump refuses to run
  # against a server newer than itself, and this runs in a CronJob, so the
  # failure surfaces in a log nobody reads rather than at install. Re-check
  # this line against the rendered StatefulSet on every authentik bump ...
  # tools/check-identity-seams.sh S10 now fails the build when the two majors
  # differ (TM-1023), and `grep -c postgres: images.txt` reads 1 when they agree.
  postgresImage: docker.io/library/postgres:17.11-bookworm
  uploaderImage: alpine/k8s:1.37.1

# ---------------------------------------------------------------------------
# THE IDENTITY DATABASE ON CLOUDNATIVEPG (TM-0788). Authentik's database as a
# CNPG Cluster this chart renders in the release namespace, the same shape as
# the model gateway's (`modelGateway.database` in tockmox-ai, key for key):
# WAL archived continuously by the Barman Cloud plugin to the shipped object
# store, a nightly base backup, and a weekly restore drill that proves the
# store holds a database somebody could come back from. It replaces the
# bundled (Bitnami) PostgreSQL and the nightly pg_dump bridge above.
#
# ON FOR A FRESH INSTALL from 0.9.0 (ruled 2026-10-27). AN INSTALL THAT ALREADY
# RUNS THE BUNDLED SERVER MUST NOT TAKE THIS DEFAULT BLIND: it would start
# Authentik on an empty database. Two things stop that from happening quietly:
#
#   1. Keep the bundled server by setting TWO keys in your identity values,
#      `identity.database.enabled: false` and `authentik.postgresql.enabled:
#      true`. Both, because the second belongs to the vendored authentik
#      chart, whose values are static YAML and cannot read the first. The
#      render guards in templates/authentik-db.yaml refuse every half-set
#      combination and name the missing key.
#   2. If you set neither, the upgrade guard (templates/authentik-db-upgrade-
#      guard.yaml) runs BEFORE anything is applied, finds the bundled server's
#      volume in the namespace, and fails the sync. Nothing is applied and
#      nothing is pruned until you choose.
#
# Moving the data across is docs/deployment/upgrade.md, "Move Authentik's
# database to CloudNativePG". That procedure is written and NOT YET PROVEN on a
# populated install (TM-0788; the proof is planned for 0.9.1).
# ---------------------------------------------------------------------------
identity:
  database:
    # On: this chart renders the CNPG Cluster below and Authentik connects to
    # it. Off: no Cluster; Authentik uses whatever `authentik.postgresql`
    # says (the bundled server, or a server of your own named in
    # `authentik.authentik.postgresql.host`).
    enabled: true
    # Cluster name. `<name>-rw` is the read/write Service Authentik must dial;
    # the shipped `authentik.authentik.postgresql.host` resolves to
    # `tockmox-authentik-db-rw`, and a guard fails the render if the two
    # disagree, because the failure otherwise shows up as a pod retrying DNS.
    # Rename it and you must set that host to `<name>-rw` as well.
    name: tockmox-authentik-db
    # The role that owns the database. MUST equal `authentik.authentik.
    # postgresql.user` (a guard checks) and the `username` key in the
    # `tockmox-authentik-db` Secret (docs/administration/secrets.md), because
    # CNPG bootstraps the owner from that Secret and Authentik logs in as the
    # user its own values name.
    owner: authentik
    # The owner's credentials, a Secret YOU create, type kubernetes.io/basic-auth:
    # `username` (the owner above) and `password`, the SAME value as
    # AUTHENTIK_POSTGRESQL__PASSWORD in `tockmox-authentik`. tools/mint-secrets.sh
    # writes both from one generated value on a fresh install.
    secretName: tockmox-authentik-db
    # 1 on a single-node cluster, 3 when you have three nodes to put them on.
    # This also decides the storage class: see storageClass below.
    instances: 1
    # The bundled server's volume was 8Gi; the same here.
    storage: 8Gi
    # Empty means "derive it from instances", exactly as for the model
    # gateway's database: `global.storageClass` at one instance, because
    # nothing else holds a copy, and `global.localStorageClass` at three or
    # more, because Postgres is already streaming to its own replicas.
    storageClass: ""
    # PINNED, PostgreSQL 18 (ruled 2026-10-27). A CNPG Cluster with no image
    # takes the operator's default ONCE, at creation, and an operator upgrade
    # that moves the default major then leaves this cluster on an older major
    # than a fresh one, which is the drift the restore drill had to learn to
    # read around (TM-1023). The tag is the minor the reference site's CNPG
    # databases run. A major-version jump on an existing data directory is a
    # dump and restore, not an image bump. Mirror it for an air-gapped install:
    # like the model gateway's, it is not listed in images.txt and
    # global.imageRegistry does not rewrite it.
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
    # The postgres container's resources (spec.resources on the Cluster). The
    # bundled server's figures, carried over: request 128Mi from the 0.8.0
    # greenfield peak; limit 512Mi, raised after Authentik's migrations and
    # blueprints OOMKilled the bundled server at 224Mi during the 0.8.0 ->
    # 0.8.1 upgrade on the lab (TM-0903). Not yet re-measured on CNPG.
    # CHANGING THIS RESTARTS THE DATABASE at instances: 1. `null` leaves it unset.
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    # Empty omits priorityClassName. Set `tockmox-apps` on a full Tockmox
    # install; naming a class that does not exist gets the pod REJECTED.
    priorityClassName: ""
    # Whether the operator creates a PodMonitor for this cluster's exporter.
    # Follows the observability capability as well; see the model gateway's
    # database for why the backup story needs it.
    monitoring:
      enablePodMonitor: true
    # DISASTER RECOVERY INTO THIS CLUSTER. Off: the cluster bootstraps empty
    # with `initdb`. On: it bootstraps from a base backup and WAL in an
    # ObjectStore (`bootstrap.recovery`). Use it on a NEW cluster: recovery
    # runs once, at first bootstrap, and does nothing to a cluster that exists.
    #   objectStoreName  the ObjectStore holding the backups; empty uses this
    #                    chart's own store when backups are on
    #   serverName       the name they were archived under (required)
    #   sourceName       the externalClusters entry; default <name>-origin
    # Recovering from your own store needs a NEW backup.serverName; a guard
    # says so. Not exercised against a live CNPG in this repo's gates.
    recovery:
      enabled: false
      objectStoreName: ""
      serverName: ""
      sourceName: ""
    # The upgrade guard (templates/authentik-db-upgrade-guard.yaml). It runs
    # before every sync while this database is on and refuses the sync if the
    # bundled server's volume is still in the namespace. Set
    # `bundledDataMigrated: true` once you have copied that data into this
    # cluster (or decided to discard it), so the old volume can be kept for a
    # release as your rollback without blocking every sync.
    upgrade:
      bundledDataMigrated: false
    # BACKUPS FOLLOW THE dataProtection CAPABILITY: the house tri-state. Unset
    # (null) follows `capabilities.dataProtection`, which is on; true or false
    # means what it says. The default assumes the platform layer's Garage and
    # Barman plugin are on and its bootstrap has copied
    # `tockmox-garage-credentials` into this namespace (platform
    # `garage.credentialsNamespaces` lists it by default).
    backup:
      enabled: null
      # With backups OFF and the observability capability on, render
      # TockmoxIdentityDatabaseUnbacked, which fires for as long as the
      # identity database has no backup. Set false only if something outside
      # this chart really covers it.
      unbackedAlert: true
      # Name an ObjectStore you created, OR leave it empty and let
      # `objectStore` below render one against the shipped Garage. Not both:
      # a guard refuses the pair.
      objectStoreName: ""
      objectStore:
        create: true
        name: tockmox-authentik-db-store
        endpoint: http://tockmox-garage.tockmox-platform.svc:3900
        region: garage
        bucket: tockmox-backups
        credentialsSecretName: tockmox-garage-credentials
        # Its own prefix in the shared bucket, under cnpg/ (the pg_dump bridge
        # writes authentik-db/, so the two never share a path).
        destinationPath: s3://tockmox-backups/cnpg/authentik
        # Base backups, and the WAL between them, older than this are pruned
        # from the store by the plugin.
        retentionPolicy: "30d"
      # The name this cluster archives under. Empty keeps CNPG's default, the
      # cluster name, and the restore drill reads the same name. Set a NEW one
      # when a cluster is RECOVERED from a store it will also archive to.
      serverName: ""
      # Six fields (CNPG includes seconds). 03:20, after the model gateway's
      # 03:00 and the pg_dump bridge's 03:10 slot, so one small Garage is not
      # absorbing every stream at once.
      schedule: "0 20 3 * * *"
      # THE SCHEDULED RESTORE DRILL for this database (templates/restore-drill.
      # yaml): bootstraps a NEW cluster from the store, asserts recovery ended
      # and Authentik's user table came back with rows, writes a dated
      # PASS/FAIL row to the drill register (an object in the object store, see
      # `register` below), and tears itself down. It never touches the live database.
      # On when backups are on.
      restoreDrill:
        enabled: true
        # Mondays 04:45, after the model gateway's 04:30 drill, so the two
        # never hold a drill cluster at the same time. FIVE fields.
        schedule: "45 4 * * 1"
        suspend: false
        image: alpine/k8s:1.37.1
        # WHERE THE DRILL RECORDS ITS ROW (TM-0459): one JSON object per run in
        # a bucket of its own in the shipped Garage, read back and checksummed
        # before the run may end as a PASS. A run whose row cannot be written or
        # read back FAILS (non-zero exit, the reason in the Job's log and its
        # termination message), so TockmoxRestoreDrillFailed pages. The platform
        # layer's bootstrap creates the bucket and a key with read and write on
        # it only (garage.drillRegister) and copies the Secret here. EMPTY uses
        # those defaults; set all three to point at your own S3 instead (the
        # Secret needs ACCESS_KEY_ID, ACCESS_SECRET_KEY and REGION: the signing
        # region must be the store's own, and Garage's is `garage`).
        register:
          endpoint: ""                 # http://tockmox-garage.tockmox-platform.svc:3900
          bucket: ""                   # tockmox-drill-register
          credentialsSecretName: ""    # tockmox-drill-register-credentials

sso:
  enabled: true
  # Group names, overridable but consistent everywhere (the app charts carry
  # the same defaults in their role mappings).
  adminGroup: tockmox-admins
  userGroup: tockmox-users
  # Usernames to ADD to the admin group (TM-0820). Default empty renders nothing.
  # Non-empty renders one Argo PostSync Job that runs inside the Authentik server
  # image and, for each name, adds the user to the admin group: it never removes
  # a member, reports a name that does not exist yet as `not-found` in the Job
  # log and still exits 0, and is safe to run on every sync. A group blueprint
  # could not do this (its `users` list is a set, and a missing user poisons
  # blueprint discovery), which is why this is a Job. Usernames only, no
  # whitespace. docs/administration/identity.md.
  adminUsers: []
  # Launch consoles from the portal in their own tab. Default true: without it
  # authentik navigates the portal tab itself, and the way back to the other
  # consoles is the browser Back button, which after an SSO redirect does not
  # reliably return to the portal.
  #
  # DECLARED HERE RATHER THAN DEFAULTED IN THE TEMPLATE, and that is the point
  # of this comment. `{{ .Values.sso.openInNewTab | default true }}` would be
  # WRONG: Helm's `default` fires on any empty value and `false` is empty, so
  # an operator who deliberately set `false` would be silently flipped back to
  # `true`. A declared key has no such failure mode.
  #
  # It is a UX opinion, not a correctness property ... a kiosk or single-console
  # deployment may legitimately want the opposite.
  openInNewTab: true
  # Who may reach each application, enforced by Authentik BEFORE the console
  # sees the login. Without a binding Authentik authorizes every authenticated
  # user for every application, whatever group they are in, and the two groups
  # above only decide the role a console hands out afterwards. With
  # `access.enabled` (the default) every shipped application is bound to the
  # group(s) its `access` names, and a user in neither group is refused at
  # Authentik. `false` renders no bindings and restores the open shape ... a
  # way back for an operator who has locked out the only admin, not a
  # configuration to run.
  #
  # Changing a group name is an SSO configuration change: the consoles need
  # the restart described in docs/administration/identity.md.
  access:
    enabled: true
  # Client IDs are public identifiers, not secrets. Changing a clientId also
  # needs the console restart in docs/administration/identity.md; GitOps will
  # report the layer healthy while the console keeps the old value.
  #
  # `access` per application: `admin` (the admin group only) or `users` (the
  # user group and the admin group). The shipped defaults keep every console
  # reachable by both groups, because the consoles already sort admins from
  # users by role (Admin/Viewer in Grafana, admin/user in Open WebUI, the two
  # Argo ServiceAccounts). Set a console to `admin` to hide it from users
  # entirely.
  #
  # `host` per application is the hostname the blueprint registers as the OIDC
  # redirect URI and the tile's launch URL. Empty derives it from the app's
  # usual prefix (`grafana.`, `chat.`, `workflows.`) plus global.internalDomain.
  # Set it to the SAME value as the app's own ingress host override
  # (`ingress.apps.openWebui.host` in the AI layer, and so on): the layers
  # cannot read each other's values, so a site that moves Open WebUI to
  # `llm.<domain>` states it twice, and a mismatch is a redirect_uri error at
  # login (TM-0820).
  #
  # `subMode` is how Authentik derives the OIDC `sub` claim. Empty renders
  # nothing, and Authentik's own default (`hashed_user_id`) applies. A site
  # migrating accounts from another provider needs the value the old provider
  # used (commonly `user_username`), because Grafana and Open WebUI key their
  # existing accounts on `sub` or email and refuse a login whose `sub`
  # changed. One of: hashed_user_id, user_id, user_uuid,
  # user_username, user_email. Per-app `subMode` wins over `sso.subMode`.
  # Changing it on a live provider changes every user's `sub`.
  subMode: ""
  apps:
    grafana:
      clientId: tockmox-grafana
      access: users
      host: ""
      subMode: ""
    openWebui:
      clientId: tockmox-openwebui
      access: users
      host: ""
      subMode: ""
    argoWorkflows:
      clientId: tockmox-argo
      access: users
      host: ""
      subMode: ""
    # The Tockmox UI (TM-0956). OFF by default in 0.9.0, unlike the three
    # above, and the reason is the greenfield rule at the top of
    # templates/sso-blueprints.yaml: its client secret comes from
    # TOCKMOX_UI_CLIENT_SECRET in a `tockmox-sso-tockmox-ui` Secret in THIS
    # namespace, an install made before 0.9.0 does not have it, and a blueprint
    # whose `!Env` resolves to nothing goes to `error` and stops discovery for
    # EVERY blueprint, the three working consoles included. So: create that
    # Secret first (tools/mint-secrets.sh --with-tockmox-ui writes it, the same
    # value as the UI's own `tockmox-sso-tockmox-ui` in the AI namespace), then
    # set `enabled: true`. Replaces the hand
    # registration in docs/administration/tockmox-ui.md. Admins only by
    # default: it is the admin console.
    tockmoxUi:
      enabled: false
      clientId: tockmox-ui
      access: admin
      host: ""            # same value as tockmoxUi.ingress.host in the AI layer
      subMode: ""
  # FORWARD-AUTH CONSOLES (TM-0425): consoles with NO sign-in of their own,
  # put behind Authentik by its embedded outpost instead of each speaking OIDC.
  # Each one turned on here renders, in its own blueprint file entry:
  #   - a proxy provider in `forward_single` mode for that ONE host, and an
  #     application with a tile and the same `access` binding as the OAuth apps.
  #     Per console, not one provider for a whole domain, so changing who may
  #     reach Longhorn does not also open Prometheus (the shared-gate blast
  #     radius a domain-level provider has);
  #   - an Ingress on that host for /outpost.goauthentik.io/ only, the sign-in
  #     callback, which must reach Authentik on the console's own hostname.
  # The ONE Traefik Middleware every console attaches (`tockmox-forward-auth`
  # in this namespace) renders whenever SSO is on; it is inert until a route
  # references it.
  #
  # THE SAME CONSOLE MUST BE TURNED ON TWICE, here and in the layer that serves
  # it (`ingress.apps.<console>.enabled` in observability or platform), and with
  # the same host if you override it: the layers cannot read each other's
  # values. Here without there is a tile that opens nothing; there without here
  # is a route Authentik refuses with "no provider for this host".
  #
  # THE EMBEDDED OUTPOST'S PROVIDER LIST IS OWNED HERE once any console is on.
  # Authentik stores which providers the embedded outpost serves as one list,
  # and a blueprint sets that list whole: it cannot append. So a proxy provider
  # you created yourself and attached to the embedded outpost is detached on
  # the next apply unless you name it in `keepProviders` (by provider name; it
  # must exist, or the blueprint fails and stops discovery for all of them).
  # With every console off, the outpost is not touched at all.
  #
  # `access`: admin | users, exactly as for the OAuth applications. Admin by
  # default: these are operator consoles, and Longhorn can delete volumes.
  forwardAuth:
    apps:
      prometheus:
        enabled: false
        host: ""          # empty derives prometheus.<internalDomain>
        access: admin
      alertmanager:
        enabled: false
        host: ""          # empty derives alertmanager.<internalDomain>
        access: admin
      longhorn:
        enabled: false
        host: ""          # empty derives longhorn.<internalDomain>
        access: admin
      traefik:
        enabled: false
        host: ""          # empty derives traefik.<internalDomain>
        access: admin
    keepProviders: []
  # LINK-ONLY TILES: consoles that have no OIDC, so there is nothing to sign in
  # WITH ... only a tile to open them from. Each entry renders an Authentik
  # application with a launch URL, icon, description and group heading, opened
  # in a new tab like the others, and bound to the role groups by `access`. It
  # renders NO OAuth2 provider, client secret or redirect URI.
  #
  # THE TILE GRANTS NOTHING. `access` decides who sees the tile; the console
  # behind it keeps its own sign-in and its own users, and asks for it. Say so
  # in `description` (the shipped ntfy one does).
  #
  # One shape per entry, key = the application slug suffix (`tockmox-<key>`):
  #   enabled      unset follows `capability`; true or false decides outright.
  #                A link with no `capability` and no `true` stays off.
  #   capability   the capability that owns the console (see `capabilities`)
  #   title        tile name; defaults to the key
  #   hostPrefix   tile host is <hostPrefix>.<global.internalDomain> ...
  #   host         ... unless this is set. Keep it equal to the console's own
  #                ingress host (the layers cannot read each other's values).
  #   path         appended to the launch URL; empty opens the host root
  #   description  one line shown on the tile
  #   group        heading the tile sits under
  #   icon         a file in charts/tockmox-identity/brand/, served in-cluster
  #   access       admin | users, exactly as for the OAuth applications
  # Add your own console by adding a key here; nothing in the template changes.
  # The identity layer follows the CAPABILITY only. A site that turns the
  # console itself off (notifications.ntfy.enabled, ingress.apps.ntfy.enabled)
  # without declining the capability sets `links.ntfy.enabled: false` too, or
  # keeps a tile that opens nothing. docs/administration/identity.md.
  links:
    ntfy:
      enabled:
      capability: notifications
      title: ntfy
      hostPrefix: ntfy
      host: ""
      # The shipped web app lives at /app (notifications.ntfy.webRoot).
      path: /app
      description: "Opens ntfy, where alerts arrive. ntfy has its own sign-in, separate from this portal: it will ask for an ntfy username and password."
      group: Observability
      icon: app-ntfy.svg
      access: users
    # Argo CD (TM-0740). A prerequisite, not a Tockmox component, so the
    # product ships no route or OIDC client for it: this tile is OFF until you
    # give Argo CD a hostname yourself, and then opens it from the portal.
    # docs/administration/argocd.md, "A hostname and a portal tile", has the
    # Ingress and Argo CD's own OIDC recipe. Set `host` if yours is not
    # argocd.<internalDomain>.
    argocd:
      enabled: false
      title: Argo CD
      hostPrefix: argocd
      host: ""
      path: ""
      description: "Opens Argo CD, the GitOps controller that applies every layer. It signs you in with its own login unless you connected it to this portal (docs: administration/argocd.md)."
      group: Infrastructure
      icon: ""
      access: admin

authentik:
  # -------------------------------------------------------------------------
  # Credentials come from Secrets YOU create ... never from these values.
  #   tockmox-authentik           AUTHENTIK_SECRET_KEY,
  #                               AUTHENTIK_POSTGRESQL__PASSWORD
  #   tockmox-authentik-postgres  password (SAME value as
  #                               AUTHENTIK_POSTGRESQL__PASSWORD ... the
  #                               database and the server must agree)
  #   tockmox-sso                 <app>_client_secret keys for the blueprints
  # Generator commands: docs/administration/secrets.md. Until they exist the
  # pods wait with a visible config error naming the missing Secret.
  # -------------------------------------------------------------------------
  # NOT authentik.existingSecret: that replaces the chart's ENTIRE generated
  # config secret ... host, database, user, all of it ... not just the
  # sensitive keys, and the pod then dials postgres on localhost. Explicit
  # env entries beat envFrom in Kubernetes precedence, so the two secrets
  # override the (empty) generated values while the generated connection
  # config survives. Found live; the kind of thing only a rollout shows.
  global:
    env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: tockmox-authentik
            key: AUTHENTIK_SECRET_KEY
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: tockmox-authentik
            key: AUTHENTIK_POSTGRESQL__PASSWORD
    envFrom:
      - secretRef:
          name: tockmox-sso
          optional: true    # sso.enabled=false installs run without it
      # TOCKMOX_UI_CLIENT_SECRET for sso.apps.tockmoxUi (TM-0956). Its own
      # Secret rather than a key in tockmox-sso, so an install minted before
      # 0.9.0 adds it without re-minting the three console secrets.
      # tools/mint-secrets.sh --with-tockmox-ui writes both halves.
      - secretRef:
          name: tockmox-sso-tockmox-ui
          optional: true
  blueprints:
    configMaps:
      - tockmox-sso-blueprints
  # No outbound version or usage calls (TM-0671): authentik checks for new
  # versions and sends startup analytics unless told not to. Sovereignty: no
  # unrequested outbound calls. (error_reporting is already off upstream.)
  authentik:
    disable_update_check: true
    disable_startup_analytics: true
    # WHICH DATABASE AUTHENTIK DIALS (TM-0788). A template, evaluated by the
    # vendored chart against ITS values, so the host follows the bundled
    # server's own switch: `<release>-postgresql` (upstream's default) while
    # `authentik.postgresql.enabled` is true, otherwise the read/write Service
    # of the CNPG cluster under `identity.database`. A parent chart cannot set
    # a subchart's value from a condition, and this is the one field upstream
    # runs through `tpl`, so the choice lives here rather than in a third key.
    # templates/authentik-db.yaml evaluates the same string and fails the
    # render if it does not land on `<identity.database.name>-rw` while that
    # database is on. Replace it outright to use a server of your own.
    postgresql:
      host: '{{ if .Values.postgresql.enabled }}{{ .Release.Name }}-postgresql{{ else }}tockmox-authentik-db-rw{{ end }}'
  server:
    resources:
      # TM-0595, measured on the prod install 2026-10-05 (accepted for the lab):
      # peak 859.7 MiB in the tockmox-* namespaces (~3-4 days at v0.7.2), 870.0 MiB in the pre-migration namespace (30 days); average 769.8 MiB.
      # limit = max peak x 1.5, rounded up (32Mi steps to 512Mi, 128Mi above);
      # request = average, rounded up to 16Mi. Re-measure before changing.
      requests:
        memory: 784Mi
      limits:
        memory: 1408Mi
    ingress:
      enabled: false        # Tockmox renders its own; see ingress above
    # ITS OWN SERVICEACCOUNT, NO TOKEN (TM-0759, found on the 0.7.1-rc2 gate).
    # The server serves HTTP and never calls the Kubernetes API; the worker holds
    # the outpost RBAC (ServiceAccount `authentik`). Upstream leaves the server on
    # the namespace's `default` account, and 0.7.1 turns that account's token off
    # from the policy layer ... but the identity layer syncs at the same time, and
    # on the rc2 greenfield the server pod was created one second before the
    # policy layer's patch landed, so it kept a token until it restarted. Naming
    # an account here makes "no token" a property of the pod, not of sync order.
    # The account is rendered by templates/server-serviceaccount.yaml; the
    # upstream chart applies automountServiceAccountToken only when
    # serviceAccountName is set, which it now is.
    serviceAccountName: tockmox-authentik-server
    automountServiceAccountToken: false
    # POD SECURITY (TM-0635). Upstream ships both contexts empty, which left the
    # server and the worker failing four `restricted` fields each:
    # allowPrivilegeEscalation, capabilities.drop, runAsNonRoot and
    # seccompProfile. Set here, in the chart an adopter inherits, so that
    # tockmox-authentik can carry pod-security enforce: restricted (see
    # `podSecurity` in tockmox-policy values) without an exemption.
    #
    # runAsUser 1000 is the user the upstream image already runs as, stated so
    # that runAsNonRoot is verifiable by the kubelet (a non-numeric image USER
    # makes it refuse to start). INFERRED, not measured: that the image's USER is
    # 1000 and that server and worker start with every capability dropped. Both
    # are what upstream documents for its own commented-out example, marked
    # there as "not all tested". readOnlyRootFilesystem is deliberately NOT set:
    # it is not a restricted field and it is untested. Verify on a lab before
    # relying on it: the worker reaches Ready and completes a blueprint run.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    metrics:
      serviceMonitor:
        enabled: true
      enabled: true
  postgresql:
    # THE BUNDLED (Bitnami) SERVER: OFF from 0.9.0 (TM-0788), because a fresh
    # install runs Authentik on the CNPG cluster under `identity.database`. An
    # install that already runs it sets this back to true, together with
    # `identity.database.enabled: false`, until it has moved its data across
    # (docs/deployment/upgrade.md). Everything below applies only while it is on.
    enabled: false
    # THE SERVER IMAGE IS PINNED HERE, not left to the subchart. authentik
    # 2026.8.4 moved its bundled default from 17.11-bookworm to 17.11-trixie:
    # same PostgreSQL, new Debian, new glibc, so an existing database reports a
    # collation version mismatch and its text indexes want a REINDEX. That is a
    # planned step, not a patch-release side effect. Held on bookworm for 0.8.x;
    # the move to trixie (with the reindex) belongs to a minor release. Keep it
    # equal to databaseBackup.postgresImage above (check-identity-seams S10).
    image:
      tag: "17.11-bookworm"
    auth:
      existingSecret: tockmox-authentik-postgres
    primary:
      resources:
        # TM-0903, measured on a 0.8.0 greenfield (household-sso profile), 2026-10-08:
        # peak 129.7 MiB working set over ~1 h of the lab's sign-ins and probes.
        # limit = peak x 1.5, rounded up to a 32Mi step (224Mi). The request,
        # 128Mi, is the peak rounded down to a 32Mi step: no average was
        # recorded. Re-measure under a real user load before changing.
        requests:
          memory: 128Mi
        # RAISED 224Mi -> 512Mi after the 0.8.0 -> 0.8.1 upgrade leg on the lab
        # (2026-10-18): Authentik 2026.8.4 ran its migrations and applied its
        # blueprints in the same minute, the working set reached 219.5 MiB and
        # the container was OOMKilled (exit 137) mid-upgrade. It recovered on
        # its own with every migration applied, but an idle peak is the wrong
        # basis for a limit an upgrade has to fit under. The request stays at
        # the idle measurement; the limit covers the upgrade burst with room.
        limits:
          memory: 512Mi
  worker:
    resources:
      # TM-0595, measured on the prod install 2026-10-05 (accepted for the lab):
      # peak 482.3 MiB in the tockmox-* namespaces (~3-4 days at v0.7.2), 475.8 MiB in the pre-migration namespace (30 days); average 423.7 MiB.
      # limit = max peak x 1.5, rounded up (32Mi steps to 512Mi, 128Mi above);
      # request = average, rounded up to 16Mi. Re-measure before changing.
      requests:
        memory: 432Mi
      limits:
        memory: 768Mi
    # POD SECURITY (TM-0635): same contexts, same reasoning and same INFERRED
    # caveat as the server block above.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    # RESTART ONTO A CHANGED BLUEPRINT (TM-1058). Authentik applies a mounted
    # blueprint two ways: its startup discovery, and a file watcher that fires
    # when kubelet swaps the ConfigMap volume. The watcher is a single thread
    # and it can die without a trace: on the homelab both workers lost it to a
    # stale database connection, after which a changed blueprint was synced by
    # Argo CD, mounted, and never applied, with every resource green and the
    # worker Ready. The hourly discovery is the only thing left that notices.
    #
    # WHY NOT A checksum/blueprints POD ANNOTATION. It is the textbook fix and
    # it cannot be written from here. The worker Deployment belongs to the
    # vendored authentik chart, which renders `podAnnotations` as literal text
    # (no `tpl`; checked against 2026.8.4, where `{{ 1 }}` arrives as `{{ 1 }}`),
    # and a subchart sees `.Values.global` and nothing else of this chart's
    # values, so even a field it does run `tpl` over could not hash a ConfigMap
    # this chart renders from `sso` and `brand`. tockmox.ssoEnvRevision in
    # tockmox-common documents the same wall. An annotation would also change
    # the pod, which swaps one worker for another and puts an old and a new
    # worker on the broker together; the strategy below is about that.
    #
    # WHAT THIS DOES INSTEAD. The container hashes everything mounted under
    # /blueprints/mounted when it starts, and the liveness probe hashes it again
    # on every period. When the two differ the probe fails and kubelet restarts
    # the CONTAINER, in the same pod, and the restart runs the startup discovery
    # over the new files. That covers every blueprint mounted through
    # `authentik.blueprints.configMaps` and `.secrets`, this chart's and a
    # site's alike, and it no longer matters whether the watcher is alive. The
    # same idea as the ntfy auth Secret probe in tockmox-observability. Cost: a
    # cat and a sha256sum of a few kilobytes every ten seconds, and one
    # container restart per blueprint change, visible as a restart count of one
    # and a `Liveness probe failed` event that says why.
    #
    # A blueprint mounted somewhere else (a `worker.volumes` entry that is not
    # under /blueprints/mounted) is not covered. The glob is deliberately the
    # directory Authentik itself scans. A probe the site replaces
    # (`authentik.worker.livenessProbe`) also drops this; keep the `cat` lines.
    lifecycle:
      postStart:
        exec:
          command:
            - /bin/sh
            - -c
            - cat /blueprints/mounted/*/* 2>/dev/null | sha256sum > /tmp/.blueprints-at-start || true
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            ak healthcheck || exit 1
            now=$(cat /blueprints/mounted/*/* 2>/dev/null | sha256sum)
            [ -s /tmp/.blueprints-at-start ] || { printf '%s\n' "$now" > /tmp/.blueprints-at-start; exit 0; }
            if [ "$now" != "$(cat /tmp/.blueprints-at-start)" ]; then
              echo "the mounted blueprints changed since this worker started: restarting onto them"
              exit 1
            fi
    # AN UPGRADE THAT ADDS A BLUEPRINT (TM-1060). The default RollingUpdate
    # starts the new worker while the old one is still running, and for that
    # window two workers share one task queue in the database. The new pod
    # queues its startup discovery, the OLD worker takes it, looks in an image
    # and a ConfigMap that do not yet hold the new blueprint, and finds
    # nothing. The task is then done and nothing re-queues it: the blueprint
    # is not applied, not errored, simply absent, until the hourly discovery on
    # the hour. Measured on the lab with twelve new blueprints: none applied
    # for up to the hour with the default, all twelve within about eight
    # seconds with the setting below.
    #
    # maxSurge 0 stops the new worker from starting before the old one is gone,
    # so there is never a second worker to take the task. maxUnavailable 100%
    # lets the old one go first. The cost is a gap of one worker start (tens of
    # seconds) with no worker at all: queued work waits in the database and
    # runs when the new worker is up, and the server pods, which carry every
    # login, are not touched. This is the strategy `type` RollingUpdate with
    # different numbers, on purpose: Argo CD applies with ServerSideApply and
    # a live Deployment cannot be switched to `type: Recreate` that way (the
    # API server refuses it while `rollingUpdate` is set, and no apply clears
    # it), so Recreate would fail the upgrade on exactly the installs it is for.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: "100%"
    metrics:
      serviceMonitor:
        enabled: true
      enabled: true
