# SPDX-License-Identifier: Apache-2.0
#
# Authentik blueprints wiring the shipped UIs into single sign-on.
#
# GREENFIELD RULE (the hard-won one): every blueprint must apply on an EMPTY
# Authentik. One invalid blueprint poisons discovery for all of them, so
# nothing here may reference an object a stock install does not have. The
# only lookups below are authentik's own defaults: the implicit-consent
# authorization flow, the default invalidation flow, the self-signed signing
# key, and the standard OAuth scope mappings.
#
# Client secrets enter via !Env from the operator-created `tockmox-sso`
# Secret (mounted envFrom on server and worker). They are never rendered.
#
# The ConfigMap itself renders even with sso.enabled=false ... the authentik
# chart mounts it by name, and a missing mount breaks the pod. Disabled just
# means only the (harmless) groups blueprint ships.
{{- if (include "tockmox.appEnabled" (dict "ctx" $ "app" "authentik")) }}
{{- $scheme := ternary "https" "http" (ne .Values.global.certIssuer "") }}
{{- $domain := .Values.global.internalDomain }}
{{- $authHost := .Values.ingress.apps.authentik.host | default (include "tockmox.internalHost" (dict "svc" "auth" "ctx" $)) }}
{{- $assets := printf "%s://%s/tockmox/logos" $scheme $authHost }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tockmox-sso-blueprints
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
data:
  tockmox-groups.yaml: |
    version: 1
    metadata:
      name: tockmox-groups
      labels:
        blueprints.goauthentik.io/description: "Tockmox role groups; app role mappings key on these names"
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: {{ .Values.sso.adminGroup }}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: {{ .Values.sso.userGroup }}
        attrs:
          is_superuser: false
{{- if .Values.brand.enabled }}
  tockmox-branding.yaml: |
    version: 1
    metadata:
      name: tockmox-branding
      labels:
        blueprints.goauthentik.io/description: "Tockmox marks on the default brand"
    entries:
      # The DEFAULT brand, matched on its domain rather than created: a stock
      # Authentik always has exactly one, and creating a second silently wins
      # or silently loses depending on domain specificity.
      #
      # `default: true` IS REQUIRED, and its absence cost a whole install.
      # "A stock Authentik always has exactly one" is false during FIRST BOOT:
      # discovery can reach this blueprint before authentik's own
      # `default/default-brand.yaml`, in which case `state: present` finds
      # nothing and CREATES the brand ... with default=False, because we did
      # not say otherwise. Authentik's own blueprint identifies on BOTH
      # `domain` AND `default: True`, so from then on it can never match, its
      # create attempt hits the unique constraint on `domain`, and it reports
      #
      #   Serializer errors {'domain': [ErrorDetail(string='This field must
      #   be unique.', code='unique')]}
      #
      # forever. The instance is then left with ZERO default brands, which
      # silently removes the recovery flow (the admin UI says "To create a
      # recovery link, set a recovery flow for the current brand") and any
      # brand fallback for hosts that match no domain.
      #
      # Observed on the clean install of 2026-08-18: default=False, 0 brands
      # with default=True, `Default - Brand` status=error. Setting default=True
      # by hand made authentik's blueprint validate again on the next pass and
      # left our marks intact, which is how the mechanism was confirmed rather
      # than guessed. Carrying the field makes this idempotent whichever
      # blueprint lands first.
      - model: authentik_brands.brand
        state: present
        identifiers:
          domain: "authentik-default"
        attrs:
          default: true
          # FULL URLs. The serializer rejects absolute paths ... and these
          # resolve to the in-cluster asset server on the same host, so the
          # login page fetches nothing from the internet.
          branding_logo: "{{ $assets }}/tockmox-lockup-horizontal-steel.svg"
          branding_favicon: "{{ $assets }}/tockmox-favicon.svg"
          branding_default_flow_background: "{{ $assets }}/flow-background.svg"
          branding_title: {{ .Values.brand.title | quote }}
{{- end }}
{{- if .Values.sso.enabled }}
{{- /*
`group` is what makes the user dashboard render sections rather than one
undifferentiated wall of tiles. Leave it unset and every application lands in
the same unlabelled block, which is what a stock install looked like until this
was added.

`icon` names a file served by the in-cluster brand server (see brand.yaml), NOT
a CDN. The reference deployment hotlinks these from jsDelivr; a shipped product
cannot, because an icon fetched from the internet is a login page that renders
half-broken on an air-gapped install. Provenance and licensing for the vendored
files: NOTICE.

`access` is WHO MAY REACH the application, and it is the part that was missing
until 2026-09-08. `group` above is Authentik's display category ... it decides
which heading a tile sits under, not who may click it. With no policy binding on
an Application, Authentik shows it to, and authorizes, EVERY authenticated user,
so the two role groups were a naming convention: the consoles' own role mappings
sorted admins from users, but a user in NEITHER group still reached every login
page and, on Grafana, got in as Viewer. Each application therefore gets a
binding to the group(s) named by `sso.apps.<app>.access`:

  admin   the admin group only
  users   the user group AND the admin group (an admin is a user too)

Changing `access` later is safe in both directions: the user-group binding is
always rendered, as state: absent under `admin`, so moving an app from users to
admin deletes the binding an earlier sync created (a blueprint never removes an
object just because its entry is gone).

Anyone in neither group is refused by Authentik before any console sees them.
`sso.access.enabled: false` renders no bindings at all and restores the open
shape; it exists so an operator locked out mid-install has a one-line way back,
not as a supported configuration.

THE BINDINGS RESTATE THE GROUPS. Each app blueprint re-declares the two groups
with `state: present` (idempotent on `name`) and binds by `!KeyOf` inside the
same file, instead of `!Find`-ing the group the groups blueprint creates. That
is the greenfield rule from the top of this file: discovery applies blueprints
in no promised order, and on first boot an app blueprint can run before the
groups one. A `!Find` that resolves to nothing puts a binding with no group,
user or policy in front of the serializer, the blueprint goes to `error`, and
one blueprint in `error` poisons discovery for all of them. Restating costs
four lines per app and removes the ordering dependency entirely.
*/ -}}
{{- $apps := list
      (dict "key" "grafana"   "title" "Grafana"        "host" (.Values.sso.apps.grafana.host | default "") "subMode" (.Values.sso.apps.grafana.subMode | default $.Values.sso.subMode | default "") "cid" .Values.sso.apps.grafana.clientId       "access" (.Values.sso.apps.grafana.access | default "users")       "env" "GRAFANA_CLIENT_SECRET"   "hostPrefix" "grafana"   "path" "/login/generic_oauth" "desc" "Metrics, logs and dashboards." "group" "Observability" "icon" "app-grafana.svg")
      (dict "key" "openwebui" "title" "Open WebUI"     "host" (.Values.sso.apps.openWebui.host | default "") "subMode" (.Values.sso.apps.openWebui.subMode | default $.Values.sso.subMode | default "") "cid" .Values.sso.apps.openWebui.clientId     "access" (.Values.sso.apps.openWebui.access | default "users")     "env" "OPENWEBUI_CLIENT_SECRET" "hostPrefix" "chat"      "path" "/oauth/oidc/callback" "desc" "Chat with models running on your own hardware." "group" "AI Apps" "icon" "app-openwebui.svg")
      (dict "key" "argo"      "title" "Argo Workflows" "host" (.Values.sso.apps.argoWorkflows.host | default "") "subMode" (.Values.sso.apps.argoWorkflows.subMode | default $.Values.sso.subMode | default "") "cid" .Values.sso.apps.argoWorkflows.clientId "access" (.Values.sso.apps.argoWorkflows.access | default "users") "env" "ARGO_CLIENT_SECRET"      "hostPrefix" "workflows" "path" "/oauth2/callback"    "desc" "Run and inspect workflows." "group" "Infrastructure" "icon" "app-argo-workflows.svg") }}
{{- /*
THE TOCKMOX UI (TM-0956) joins the list only when `sso.apps.tockmoxUi.enabled`
is true: off by default in 0.9.0, because its secret is a key an older
`tockmox-sso` Secret lacks, and an `!Env` that resolves to nothing puts this
blueprint in `error` and stops discovery for every other one (values.yaml says
how to turn it on safely). Two fields the other three do not carry, both from
docs/administration/tockmox-ui.md: the invalidation flow is
`default-invalidation-flow`, so the UI's Sign out ends the Authentik session and
not only this application's; and the UI's own address is registered as a
post-logout redirect URI, so Sign out lands back on its sign-in page.
*/ -}}
{{- $ui := .Values.sso.apps.tockmoxUi | default dict }}
{{- if eq $ui.enabled true }}
{{- $apps = append $apps (dict "key" "tockmoxui" "title" "Tockmox" "host" ($ui.host | default "") "subMode" ($ui.subMode | default $.Values.sso.subMode | default "") "cid" ($ui.clientId | default "tockmox-ui") "access" ($ui.access | default "admin") "env" "TOCKMOX_UI_CLIENT_SECRET" "hostPrefix" "tockmox" "path" "/auth/callback" "desc" "Platform administration: status, nodes, models and versions." "group" "Infrastructure" "icon" "" "invalidation" "default-invalidation-flow" "logoutPath" "/") }}
{{- end }}
{{- /*
LINK-ONLY APPLICATIONS (`sso.links.<key>`): a tile that opens a console which
has no OIDC to attach a provider to. Authentik's Application.provider is
optional (a nullable one-to-one on the model, and absent from the blueprint
schema's `required` list), so the entry simply omits it: no OAuth2 provider, no
client secret, no redirect URI, no `!Env`. Everything else is the same as an
OAuth tile ... launch URL, icon, description, group heading, new-tab, and the
same role-group binding, so `tools/check-sso-bindings.sh` holds for it too.

THE TILE GRANTS NOTHING. The binding decides who SEES the tile; the console
behind it still asks for its own sign-in, and its own users and ACL decide what
that person may do. Say so in `description`, or an operator who has just
watched three consoles open without a second login will expect the fourth to
do the same.

`enabled` is a tri-state like `apps.<x>.enabled`: unset follows the capability
named in `capability` (a link with no `capability` and no explicit `true` stays
off), `true` and `false` mean what they say. The identity layer cannot read
another layer's values, so it follows the capability, not the other layer's
per-component switches ... a site that turns the console itself off without
declining the capability sets `enabled: false` here as well.
*/ -}}
{{- /* Keys whose `tockmox-<key>` slug is already taken by a shipped application
(the OAuth consoles and the forward-auth consoles): a link with one of these
keys would overwrite that application's tile. */ -}}
{{- $oauthKeys := list "grafana" "openwebui" "argo" "tockmoxui" "prometheus" "alertmanager" "longhorn" "traefik" }}
{{- $links := list }}
{{- range $key, $l := (.Values.sso.links | default dict) }}
{{- if has $key $oauthKeys }}
{{- fail (printf "sso.links.%s collides with the OAuth application of the same key; choose another key" $key) }}
{{- end }}
{{- $on := false }}
{{- if kindIs "invalid" $l.enabled }}
{{- if $l.capability }}
{{- $on = ne (include "tockmox.capabilityEnabled" (dict "ctx" $ "capability" $l.capability "app" "")) "" }}
{{- end }}
{{- else }}
{{- $on = $l.enabled }}
{{- end }}
{{- if $on }}
{{- if and (not $l.host) (not $l.hostPrefix) }}
{{- fail (printf "sso.links.%s needs a host or a hostPrefix" $key) }}
{{- end }}
{{- if and $.Values.brand.enabled $l.icon (not ($.Files.Get (printf "brand/%s" $l.icon))) }}
{{- fail (printf "sso.links.%s.icon %q is not a file in charts/tockmox-identity/brand/" $key $l.icon) }}
{{- end }}
{{- $links = append $links (dict "link" true "key" $key "title" ($l.title | default $key) "host" ($l.host | default "") "hostPrefix" ($l.hostPrefix | default "") "path" ($l.path | default "") "access" ($l.access | default "users") "desc" ($l.description | default "") "group" ($l.group | default "") "icon" ($l.icon | default "") "cid" (printf "tockmox-%s" $key)) }}
{{- end }}
{{- end }}
{{- $accessOn := dig "access" "enabled" true .Values.sso }}
{{- $subModes := list "hashed_user_id" "user_id" "user_uuid" "user_username" "user_email" }}
{{- range $app := (concat $apps $links) }}
{{- /* Redirect host: an explicit sso.apps.<app>.host wins, else <prefix>.<domain>. Mirrors the per-app ingress host override in the layer that serves the app (TM-0820). */ -}}
{{- $appHost := $app.host | default (printf "%s.%s" $app.hostPrefix $domain) }}
{{- if and $app.subMode (not (has $app.subMode $subModes)) }}
{{- fail (printf "sso.apps.%s.subMode (or sso.subMode) must be one of %s, got %q" $app.key (join ", " $subModes) $app.subMode) }}
{{- end }}
{{- if not (has $app.access (list "admin" "users")) }}
{{- fail (printf "sso.apps.%s.access must be \"admin\" or \"users\", got %q" $app.key $app.access) }}
{{- end }}
  tockmox-app-{{ $app.key }}.yaml: |
    version: 1
    metadata:
      name: tockmox-app-{{ $app.key }}
    entries:
{{- if not $app.link }}
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: provider-{{ $app.key }}
        identifiers:
          name: {{ $app.cid }}
        attrs:
          client_type: confidential
          client_id: {{ $app.cid }}
{{- if $app.subMode }}
          sub_mode: {{ $app.subMode }}
{{- end }}
          client_secret: !Env {{ $app.env }}
          # Explicit, because a blueprint-created provider gets an EMPTY
          # grant-type list where the admin UI would default sensibly, and an
          # empty list rejects every authorize request with invalid_request.
          # Found live on the first end-to-end login.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, {{ $app.invalidation | default "default-provider-invalidation-flow" }}]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: "{{ $scheme }}://{{ $appHost }}{{ $app.path }}"
{{- if $app.logoutPath }}
            - matching_mode: strict
              url: "{{ $scheme }}://{{ $appHost }}{{ $app.logoutPath }}"
              redirect_uri_type: logout
{{- end }}
{{- end }}
      - model: authentik_core.application
        state: present
        id: app-{{ $app.key }}
        identifiers:
          slug: {{ $app.cid }}
        attrs:
          name: {{ $app.title }}
{{- if not $app.link }}
          provider: !KeyOf provider-{{ $app.key }}
{{- end }}
          # Tile metadata. Without meta_launch_url the card on the user
          # dashboard is decorative ... it renders and does nothing when
          # clicked, which reads as a broken deployment rather than a missing
          # field.
          meta_launch_url: "{{ $scheme }}://{{ $appHost }}{{ if $app.link }}{{ $app.path }}{{ end }}"
          meta_description: {{ $app.desc | quote }}
          meta_publisher: {{ $.Values.brand.title | quote }}
          group: {{ $app.group | quote }}
          # Launch each console in its own tab, so the portal survives being
          # used. Without this authentik navigates the portal tab itself, and
          # the operator's way back to the other consoles is the browser Back
          # button ... which on a console that has just completed an SSO
          # redirect does not reliably return to the portal.
          # The key is DECLARED in values.yaml, deliberately, so this is a bare
          # reference. `| default true` here would be a bug: Helm's `default`
          # fires on any empty value and `false` is empty, so an explicit
          # `false` would be flipped back to `true`.
          open_in_new_tab: {{ $.Values.sso.openInNewTab }}
{{- if and $.Values.brand.enabled $app.icon }}
          meta_icon: "{{ $assets }}/{{ $app.icon }}"
{{- end }}
{{- if $accessOn }}
      # Access: who may reach {{ $app.title }} ({{ $app.access }}). See the
      # note above the app list. Groups restated so this file applies alone.
      - model: authentik_core.group
        state: present
        id: group-admin-{{ $app.key }}
        identifiers:
          name: {{ $.Values.sso.adminGroup }}
        attrs:
          is_superuser: false
      # Bindings are identified by target AND group, never by order. An order
      # identifier matches whatever else sits at that order on the application
      # (a site's own policy binding, say) and would rewrite it.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-{{ $app.key }}
          group: !KeyOf group-admin-{{ $app.key }}
        attrs:
          order: 0
          enabled: true
      - model: authentik_core.group
        state: present
        id: group-user-{{ $app.key }}
        identifiers:
          name: {{ $.Values.sso.userGroup }}
        attrs:
          is_superuser: false
      # Rendered for `admin` too, as state: absent. A blueprint only creates and
      # updates what it lists, so leaving this entry out when a site moves an
      # app from users to admin would leave the user-group binding in place,
      # and with Authentik's default ANY engine mode that binding alone still
      # lets every user in. absent deletes it; on an install that never had it,
      # absent is a no-op.
      - model: authentik_policies.policybinding
        state: {{ ternary "present" "absent" (eq $app.access "users") }}
        identifiers:
          target: !KeyOf app-{{ $app.key }}
          group: !KeyOf group-user-{{ $app.key }}
        attrs:
          order: 1
          enabled: true
{{- end }}
{{- end }}
{{- /*
FORWARD-AUTH CONSOLES (TM-0425, TM-0217). One blueprint file for all of them,
because the embedded outpost's provider list is ONE field: it is set whole from
every enabled console plus `keepProviders`, and two files setting it would undo
each other. values.yaml (`sso.forwardAuth`) explains why the list is owned here.

Each console gets a proxy provider in `forward_single` mode for exactly its
host, an application (tile) and the same group bindings as the OAuth apps, so
`tools/check-sso-bindings.sh` covers them too. A console switched OFF renders
its provider and application as `state: absent`: a blueprint never removes an
object just because its entry disappeared, so without this a console turned off
here would keep a provider the outpost no longer serves and a tile that opens a
route which is gone. On an install that never had them, absent is a no-op.

THE OUTPOST ENTRY IS RENDERED ONLY WHEN AT LEAST ONE CONSOLE IS ON, and with
none on the embedded outpost is left exactly as it is. It is identified by
`managed`, the stable marker Authentik itself creates it with, never by its
display name, which an operator can rename.

THE OUTPOST ENTRY ALSO SETS `config.authentik_host` (TM-0425, the maintainers' lab,
2026-10-28). The embedded outpost builds the browser-facing sign-in URL from it:
`GetOIDCEndpoint` in the outpost's endpoint.go rewrites scheme and host of the
authorization and end-session URLs to `authentik_host` for an embedded outpost,
and with it blank logs "Outpost has localhost/blank API Connection but no
authentik_host is configured" and leaves the URL as the API returned it. That is
`http://localhost/application/o/authorize/...`, so an unauthenticated request to
a forward-auth console was refused correctly and redirected to nothing. A fresh
Authentik creates the embedded outpost with `authentik_host: ""` and nothing in
a stock install fills it. Nothing else is needed: for an embedded outpost the
same function uses `authentik_host` alone (`authentik_host_browser` is read only
for a non-embedded outpost), and users and the outpost see one auth host.

`config` is a JSON field and a blueprint REPLACES it whole (the importer
saves with `partial=True`, which merges top-level fields, not the contents of a
JSON field). A one-key dict is safe: the API's `validate_config` runs
`from_dict(OutpostConfig, config)` and the model's `config` property does the
same on read, so every other key takes its dataclass default; the Go outpost
reads only `authentik_host` (required, set here) and `log_level` (with a
fallback). Keys an operator set by hand on the embedded outpost are therefore
dropped at the next apply, like its provider list, once any console is on.
The value is the auth host the OAuth apps in this file already use; the
trailing slash is the form the lab premise check ran with.

Greenfield rule: the only lookups are the two default flows already used above.
`keepProviders` names objects a stock install does not have, which is why it is
empty by default and why values.yaml says a missing name fails the blueprint.
*/ -}}
{{- $faApps := list
      (dict "key" "prometheus"   "title" "Prometheus"        "prefix" "prometheus"   "desc" "Metrics and the alert rules as Prometheus evaluates them." "group" "Observability" "icon" "")
      (dict "key" "alertmanager" "title" "Alertmanager"      "prefix" "alertmanager" "desc" "Firing alerts, silences and inhibitions."                  "group" "Observability" "icon" "")
      (dict "key" "longhorn"     "title" "Longhorn"          "prefix" "longhorn"     "desc" "Volumes, replicas and backups. Can delete volumes."       "group" "Infrastructure" "icon" "")
      (dict "key" "traefik"      "title" "Traefik dashboard" "prefix" "traefik"      "desc" "Routers, services and middlewares as Traefik sees them."  "group" "Infrastructure" "icon" "") }}
{{- $faCfg := (.Values.sso.forwardAuth | default dict) }}
{{- $faOn := list }}
{{- range $fa := $faApps }}
{{- $c := index ($faCfg.apps | default dict) $fa.key | default dict }}
{{- if not (has ($c.access | default "admin") (list "admin" "users")) }}
{{- fail (printf "sso.forwardAuth.apps.%s.access must be \"admin\" or \"users\", got %q" $fa.key $c.access) }}
{{- end }}
{{- if eq $c.enabled true }}{{- $faOn = append $faOn $fa.key }}{{- end }}
{{- end }}
  tockmox-forward-auth.yaml: |
    version: 1
    metadata:
      name: tockmox-forward-auth
      labels:
        blueprints.goauthentik.io/description: "Tockmox consoles behind forward-auth (no sign-in of their own)"
    entries:
{{- range $fa := $faApps }}
{{- $c := index ($faCfg.apps | default dict) $fa.key | default dict }}
{{- $on := eq $c.enabled true }}
{{- $faHost := $c.host | default (printf "%s.%s" $fa.prefix $domain) }}
{{- $access := $c.access | default "admin" }}
      - model: authentik_providers_proxy.proxyprovider
        state: {{ ternary "present" "absent" $on }}
        id: provider-fa-{{ $fa.key }}
        identifiers:
          name: tockmox-fa-{{ $fa.key }}
{{- if $on }}
        attrs:
          mode: forward_single
          external_host: "{{ $scheme }}://{{ $faHost }}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
{{- end }}
      - model: authentik_core.application
        state: {{ ternary "present" "absent" $on }}
        id: app-fa-{{ $fa.key }}
        identifiers:
          slug: tockmox-{{ $fa.key }}
{{- if $on }}
        attrs:
          name: {{ $fa.title | quote }}
          provider: !KeyOf provider-fa-{{ $fa.key }}
          meta_launch_url: "{{ $scheme }}://{{ $faHost }}{{ if eq $fa.key "traefik" }}/dashboard/{{ end }}"
          meta_description: {{ $fa.desc | quote }}
          meta_publisher: {{ $.Values.brand.title | quote }}
          group: {{ $fa.group | quote }}
          open_in_new_tab: {{ $.Values.sso.openInNewTab }}
{{- if and $accessOn }}
      - model: authentik_core.group
        state: present
        id: group-admin-fa-{{ $fa.key }}
        identifiers:
          name: {{ $.Values.sso.adminGroup }}
        attrs:
          is_superuser: false
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-fa-{{ $fa.key }}
          group: !KeyOf group-admin-fa-{{ $fa.key }}
        attrs:
          order: 0
          enabled: true
      - model: authentik_core.group
        state: present
        id: group-user-fa-{{ $fa.key }}
        identifiers:
          name: {{ $.Values.sso.userGroup }}
        attrs:
          is_superuser: false
      - model: authentik_policies.policybinding
        state: {{ ternary "present" "absent" (eq $access "users") }}
        identifiers:
          target: !KeyOf app-fa-{{ $fa.key }}
          group: !KeyOf group-user-fa-{{ $fa.key }}
        attrs:
          order: 1
          enabled: true
{{- end }}
{{- end }}
{{- end }}
{{- if $faOn }}
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          config:
            authentik_host: "{{ $scheme }}://{{ $authHost }}/"
          providers:
{{- range $k := $faOn }}
            - !KeyOf provider-fa-{{ $k }}
{{- end }}
{{- range $name := ($faCfg.keepProviders | default list) }}
            - !Find [authentik_providers_proxy.proxyprovider, [name, {{ $name | quote }}]]
{{- end }}
{{- end }}
{{- end }}
{{- end }}
