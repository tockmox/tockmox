{{- /*
SPDX-License-Identifier: Apache-2.0

The Authentik server's own ServiceAccount, with no token (TM-0759). The server
Deployment comes from the vendored authentik chart, which names this account
because values.yaml sets authentik.server.serviceAccountName. Rendered only for
that exact name: a site that points the server at an account of its own keeps
it, and this file renders nothing. No namespace, like the server Deployment
itself and tockmox-brand: both land in the Application's destination namespace.

NEVER PRUNED (found proving this on the lab, 0.7.1-rc2 gate). Kubernetes copies
`serviceAccountName` into the deprecated `serviceAccount` field of the pod
template, and a later apply that drops `serviceAccountName` leaves that copy
behind, which fills `serviceAccountName` straight back in. So a rollback to a
chart without this account (or a site that renames it) keeps the Deployment
pointed at it; if Argo had pruned the account, every new server pod would be
refused ("error looking up service account"). Prune=false,Delete=false keeps the
account (no token, no RBAC) so that path stays a working server. The cost,
measured on the lab rollback: the identity Application then reads OutOfSync on
this one account (it requires pruning) until someone removes it and the two
pod-template fields by hand. A visible OutOfSync is the better failure than a
server that cannot start its next pod.
*/ -}}
{{- if and (include "tockmox.appEnabled" (dict "ctx" $ "app" "authentik")) (eq ((.Values.authentik.server | default dict).serviceAccountName | default "") "tockmox-authentik-server") }}
# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tockmox-authentik-server
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    {{- include "tockmox.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
