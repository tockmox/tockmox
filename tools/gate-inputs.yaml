#
# What each gate reads, so a pull request runs only the gates its changes can affect.
# tools/gate-plan.py applies it; check-all.sh --changed-from REF asks for it; a run with no
# arguments, every push to main and the nightly run ignore it and run every gate.
#
# THE RULES, in the order they apply:
#   1. A changed path under `always_full` runs every gate.
#   2. A gate listed under `gates` runs when a changed path matches one of its inputs.
#   3. A gate NOT listed runs on every pull request. Listing one is an opt-in to skipping it.
#
# An input is a path glob: `*` stays inside a directory, `**` crosses them, a trailing `/` means
# everything under that directory, and `@render` stands for the render class below. Declare too
# much rather than too little: an extra input costs a few seconds on some pull requests, a missing
# one lets a change through that the nightly full run then catches a day late.
#
# WHAT IS LISTED. The gates that cost five seconds or more in the 2026-10-30 measurement (most of
# check-all's time); every quick gate stays unlisted and always runs. Each list is the gate's script,
# the files its code names (data files, fixtures, the pages it executes or reads), and @render when
# it renders the charts. tools/lib/ is under always_full, so a shared helper is never missed.
#
# KEEPING IT TRUE. `check-all.sh` runs `gate-plan.py check-inputs`: a key that no longer names a
# gate, a class nobody uses and an input that matches no tracked file are each a failure, so a
# renamed gate or a moved fixture cannot quietly narrow a selection. When you give a gate a new
# input (a fixture, a docs page it reads, a data file), add it here in the same change.

always_full:
  - tools/check-all.sh
  - tools/gate-plan.py
  - tools/gate-inputs.yaml
  - tools/lib/
  - tools/toolchain.sh
  - tools/helm-deps.sh
  - tools/test-helm-deps.sh
  - tools/requirements-gates.in
  - tools/requirements-gates.txt
  - mise.toml
  - mise.lock
  - .github/workflows/check-all.yaml

classes:
  # Everything a helm render of a layer reads: the charts, CI's values and overlays, the profiles,
  # and the installer that writes a site's values.
  render:
    - charts/
    - ci/
    - profiles/
    - install/

