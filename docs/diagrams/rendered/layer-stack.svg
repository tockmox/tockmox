<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The nine Tockmox layers in six sync waves</title>
<desc id="d">Bottom to top. Wave 0: crds, every CRD first, required. Wave 1: policy, namespaces, default-deny networking and RBAC admission guardrails, required. Wave 2: platform, storage, load balancing, ingress, certificates and databases, partly declinable. Wave 3: observability, metrics, logs, dashboards and alerting, beside exporters, hardware and network telemetry. Wave 4: identity, single sign-on through Authentik. Wave 5: devops, workflows, off by default; ai, the chat console and model gateway; selfcheck, the heartbeat. Argo CD waits for each wave to report healthy before starting the next. Every layer from wave 3 up can be declined.</desc>
<defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6963"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F8F45"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B7790F"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F67B0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A24"/></marker></defs>
<rect x="1" y="1" width="1038" height="648" rx="14" fill="#FBFBF8" stroke="#D3D8D2" stroke-width="1.5"/>
<text x="32" y="42" font-size="21" font-weight="700" text-anchor="start" fill="#1F2A24">Nine layers, six waves</text>
<text x="32" y="64" font-size="13" font-weight="400" text-anchor="start" fill="#6B756F">Argo CD deploys a wave only after the one below it reports healthy.</text>
<text x="40" y="550" font-size="13" font-weight="700" text-anchor="start" fill="#1B417A" letter-spacing="1">WAVE 0</text>
