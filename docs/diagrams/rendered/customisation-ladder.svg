<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The Tockmox customisation ladder</title>
<desc id="d">Four rungs, from the bottom. Rung 1, values: anything a chart exposes, no upgrade cost on a key tiered stable. Rung 2, extension points: a dashboard, an alert rule or a NetworkPolicy dropped into your repository, no upgrade cost. Rung 3, a Kustomize patch: a shipped resource that is not exposed; it fails loudly when the base moves and you fix it at upgrade time. Rung 4, disable and replace: you own the replacement. Reach for the lowest rung that works. Needing rung 3 or 4 repeatedly is a values gap worth an issue. Editing resources in the cluster by hand is not a rung: it is reverted.</desc>
<defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6963"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F8F45"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B7790F"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F67B0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A24"/></marker></defs>
<rect x="1" y="1" width="1038" height="598" rx="14" fill="#FBFBF8" stroke="#D3D8D2" stroke-width="1.5"/>
<text x="32" y="42" font-size="21" font-weight="700" text-anchor="start" fill="#1F2A24">Change what Tockmox ships</text>
<text x="32" y="64" font-size="13" font-weight="400" text-anchor="start" fill="#6B756F">Start at the bottom. Move up only when the rung below cannot express what you need.</text>
<rect x="120" y="470" width="620" height="76" rx="10" fill="#E9F6EC" stroke="#2F8F45" stroke-width="1.6"/>
<text x="138" y="500" font-size="15" font-weight="700" text-anchor="start" fill="#17572A">1  Values</text>
<text x="138" y="524" font-size="12" font-weight="400" text-anchor="start" fill="#4A5550">anything a chart already exposes</text>
<text x="756" y="504" font-size="11" font-weight="700" text-anchor="start" fill="#6B756F">Upgrade cost</text>
<text x="756" y="522" font-size="12" font-weight="400" text-anchor="start" fill="#1F2A24">none on a key tiered stable</text>
<rect x="160" y="374" width="580" height="76" rx="10" fill="#E9F6EC" stroke="#2F8F45" stroke-width="1.6"/>
<text x="178" y="404" font-size="15" font-weight="700" text-anchor="start" fill="#17572A">2  Extension points</text>
<text x="178" y="428" font-size="12" font-weight="400" text-anchor="start" fill="#4A5550">a dashboard, an alert rule, a NetworkPolicy in your repo</text>
<text x="756" y="408" font-size="11" font-weight="700" text-anchor="start" fill="#6B756F">Upgrade cost</text>
<text x="756" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#1F2A24">none: a separate object of yours</text>
<rect x="200" y="278" width="540" height="76" rx="10" fill="#FFF5E0" stroke="#B7790F" stroke-width="1.6"/>
<text x="218" y="308" font-size="15" font-weight="700" text-anchor="start" fill="#6E4A06">3  Kustomize patch</text>
<text x="218" y="332" font-size="12" font-weight="400" text-anchor="start" fill="#4A5550">a shipped resource that is not exposed</text>
<text x="756" y="312" font-size="11" font-weight="700" text-anchor="start" fill="#6B756F">Upgrade cost</text>
<text x="756" y="330" font-size="12" font-weight="400" text-anchor="start" fill="#1F2A24">fails loudly when the base moves</text>
<rect x="240" y="182" width="500" height="76" rx="10" fill="#FFF5E0" stroke="#B7790F" stroke-width="1.6"/>
<text x="258" y="212" font-size="15" font-weight="700" text-anchor="start" fill="#6E4A06">4  Disable and replace</text>
<text x="258" y="236" font-size="12" font-weight="400" text-anchor="start" fill="#4A5550">replacing a component outright</text>
<text x="756" y="216" font-size="11" font-weight="700" text-anchor="start" fill="#6B756F">Upgrade cost</text>
<text x="756" y="234" font-size="12" font-weight="400" text-anchor="start" fill="#1F2A24">you own the replacement</text>
<path d="M 70 540 L 70 196" fill="none" stroke="#2F67B0" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="58" y="370" font-size="11.5" font-weight="700" fill="#1B417A" text-anchor="middle" transform="rotate(-90 58 370)" letter-spacing="1.2">MORE OF IT IS YOURS AT UPGRADE</text>
<text x="320" y="150.0" font-size="12" font-weight="600" text-anchor="start" fill="#6E4A06">On rung 3 or 4 repeatedly? That is a values gap, and an issue worth opening.</text>
<path d="M 860 120 L 860 160" stroke="#C62828" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
<path d="M 854 154 L 866 166" stroke="#C62828" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 854 166 L 866 154" stroke="#C62828" stroke-width="2.6" stroke-linecap="round"/>
<text x="846" y="112.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#8E1B1B">kubectl edit in the cluster</text>
<text x="846" y="127.525" font-size="11.5" font-weight="600" text-anchor="end" fill="#8E1B1B">is not a rung: it is reverted</text>
</svg>
