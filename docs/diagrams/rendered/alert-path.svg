<text x="74" y="456.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#17572A">THE SELF-CHECK</text>
<text x="74" y="480.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24">A heartbeat CronJob posts an alert to</text>
<text x="74" y="495.525" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24">Alertmanager every 15 minutes. It</text>
<text x="74" y="511.05" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24">travels the whole path to the phone.</text>
<text x="74" y="526.575" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24"></text>
<text x="74" y="542.1" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24">If it stops succeeding, Prometheus</text>
<text x="74" y="557.625" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24">fires TockmoxSelfCheckStale: the</text>
<text x="74" y="573.15" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2A24">monitoring plane itself is down.</text>
