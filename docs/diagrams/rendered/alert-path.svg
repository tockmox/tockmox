<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How a Tockmox alert reaches a person, and how the path watches itself</title>
<desc id="d">Workloads expose metrics that Prometheus scrapes, and pod logs go through Alloy to Loki; Grafana shows both. Prometheus evaluates the alert rules and sends firing alerts to Alertmanager, which posts them to the alert bridge, which publishes them to ntfy, where a subscribed phone receives them. Apprise, off by default, can fan out to email or chat. On iOS, lock-screen notifications need an optional relay through ntfy.sh, off by default, through which a wakeup and the topic name leave your network. Every 15 minutes the self-check heartbeat posts an alert to Alertmanager that travels the same path; if it stops succeeding, TockmoxSelfCheckStale fires. The bridge publishes its own delivery health as metrics, and three alerts render a dead notification path on a dashboard. Alertmanager's always-firing Watchdog goes to a null receiver, not to the phone.</desc>
