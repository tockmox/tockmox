<text x="404" y="241" font-size="12.5" font-weight="700" text-anchor="start" fill="#17572A">yes</text>
<text x="380" y="264" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">to the BackupTarget</text>
<circle cx="588" cy="236" r="8" fill="#2F8F45" stroke="#2F8F45" stroke-width="2"/>
<text x="604" y="241" font-size="12.5" font-weight="700" text-anchor="start" fill="#17572A">yes</text>
<text x="580" y="264" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">2026-10-01 all 19 in prod, 2026-10-10 lab</text>
<circle cx="828" cy="236" r="8" fill="#FFFFFF" stroke="#8A938E" stroke-width="2"/>
<text x="844" y="241" font-size="12.5" font-weight="700" text-anchor="start" fill="#4A5550">no</text>
<text x="820" y="264" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">not scheduled</text>
<rect x="30" y="292" width="980" height="70" rx="10" fill="#FFFFFF" stroke="#7C8781" stroke-width="1.6"/>
<text x="50" y="322" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A24">Authentik's bundled Postgres</text>
<text x="50" y="342" font-size="11.5" font-weight="400" text-anchor="start" fill="#4A5550">nightly pg_dump</text>
<circle cx="388" cy="318" r="8" fill="#2F8F45" stroke="#2F8F45" stroke-width="2"/>
<text x="404" y="323" font-size="12.5" font-weight="700" text-anchor="start" fill="#17572A">yes</text>
<text x="380" y="346" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">byte-verified upload</text>
<circle cx="588" cy="318" r="8" fill="#2F8F45" stroke="#2F8F45" stroke-width="2"/>
<text x="604" y="323" font-size="12.5" font-weight="700" text-anchor="start" fill="#17572A">yes</text>
<text x="580" y="346" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">2026-10-10, lab, login after</text>
