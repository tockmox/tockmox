<text x="844" y="323" font-size="12.5" font-weight="700" text-anchor="start" fill="#4A5550">no</text>
<text x="820" y="346" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">not scheduled</text>
<rect x="30" y="374" width="980" height="70" rx="10" fill="#FFFFFF" stroke="#7C8781" stroke-width="1.6"/>
<text x="50" y="404" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A24">Sealed-secrets controller key</text>
<text x="50" y="424" font-size="11.5" font-weight="400" text-anchor="start" fill="#4A5550">escrow, off the cluster</text>
<circle cx="388" cy="400" r="8" fill="#2F8F45" stroke="#2F8F45" stroke-width="2"/>
<text x="404" y="405" font-size="12.5" font-weight="700" text-anchor="start" fill="#17572A">yes</text>
<text x="380" y="428" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">you export it</text>
<circle cx="588" cy="400" r="8" fill="#2F8F45" stroke="#2F8F45" stroke-width="2"/>
<text x="604" y="405" font-size="12.5" font-weight="700" text-anchor="start" fill="#17572A">yes</text>
<text x="580" y="428" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">2026-10-04, fresh controller, lab</text>
<circle cx="828" cy="400" r="8" fill="#FFFFFF" stroke="#8A938E" stroke-width="2"/>
<text x="844" y="405" font-size="12.5" font-weight="700" text-anchor="start" fill="#4A5550">no</text>
<text x="820" y="428" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">drill not yet run</text>
<rect x="30" y="456" width="980" height="70" rx="10" fill="#FFF8F8" stroke="#C62828" stroke-width="1.6"/>
<text x="50" y="486" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A24">The whole cluster</text>
<text x="50" y="506" font-size="11.5" font-weight="400" text-anchor="start" fill="#4A5550">rebuild and restore, as one</text>
<circle cx="388" cy="482" r="8" fill="#FFFFFF" stroke="#8A938E" stroke-width="2"/>
<text x="404" y="487" font-size="12.5" font-weight="700" text-anchor="start" fill="#4A5550">no</text>
<text x="380" y="510" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">assembled from the rows</text>
<circle cx="588" cy="482" r="8" fill="#FFFFFF" stroke="#8A938E" stroke-width="2"/>
<text x="604" y="487" font-size="12.5" font-weight="700" text-anchor="start" fill="#4A5550">no</text>
<text x="580" y="510" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">never run as one exercise</text>
<circle cx="828" cy="482" r="8" fill="#FFFFFF" stroke="#8A938E" stroke-width="2"/>
<text x="844" y="487" font-size="12.5" font-weight="700" text-anchor="start" fill="#4A5550">no</text>
<text x="820" y="510" font-size="11" font-weight="400" text-anchor="start" fill="#4A5550">not claimed</text>
<text x="30" y="556.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#4A5550">The shipped object store runs inside the cluster it protects, so a backup kept only there</text>
<text x="30" y="571.525" font-size="11.5" font-weight="400" text-anchor="start" fill="#4A5550">does not survive losing the cluster. Point backups off the cluster for data you care about.</text>
