<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where a chat request goes in Tockmox</title>
<desc id="d">Inside your network and your cluster, the browser reaches the chat console through ingress and single sign-on. The console holds only a scoped key; its egress is limited to DNS, the AI namespace and the ingress controller, so it cannot reach a model host or the internet directly. Every request goes through the model gateway, which holds the provider credentials and whose model list ships empty. From the gateway: an optional in-cluster Ollama, off by default; a model host on your network, reachable once you add an egress entry for it; or, crossing the boundary on HTTPS port 443, a frontier provider, only if you add one to the model list. Local inference does not by itself make an installation air-gapped.</desc>
