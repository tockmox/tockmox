<text x="32" y="42" font-size="21" font-weight="700" text-anchor="start" fill="#1F2A24">Where a request goes</text>
<text x="32" y="64" font-size="13" font-weight="400" text-anchor="start" fill="#6B756F">The route you configure decides where the conversation goes. Nothing routes until you name a model.</text>
