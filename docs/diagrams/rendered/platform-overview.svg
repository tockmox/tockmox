<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Tockmox at a glance</title>
<desc id="d">Inside a solid boundary for your hardware and your network: a person signs in through single sign-on to the chat console, which sends every request through the model gateway to a model host you run, in the cluster or on your network. Around the AI plane sit identity, policy, storage and certificates, observability with alerts to a phone, backups with a weekly restore drill for the gateway database, and a self-check heartbeat. Underneath is the foundation you provide: Kubernetes, Argo CD and sealed-secrets, reconciling everything from your site repository. Outside the boundary, a frontier provider is reachable only through the gateway and only if you configure it; a request sent there takes the conversation with it.</desc>
