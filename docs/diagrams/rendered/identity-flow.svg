<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Identity and trust in Tockmox</title>
<desc id="d">Your browser runs on a machine whose trust store holds the Tockmox private CA. It reaches the consoles over HTTPS through the Traefik ingress, with certificates cert-manager issues from that CA. Authentik is the OIDC provider for three shipped consoles, Grafana, Open WebUI and Argo Workflows, which exchange the token from inside their own containers and so need the CA in the cluster too. Two groups, tockmox-admins and tockmox-users, decide who reaches each console and in which role; a user in neither group is refused by Authentik. Prometheus, Alertmanager, Longhorn and the Traefik dashboard have no sign-in of their own and can be put behind Authentik's forward-auth, off by default. Each OIDC console keeps a local break-glass login outside the group model. Forgejo is planned, not shipped, and ntfy is a portal link with no single sign-on.</desc>
