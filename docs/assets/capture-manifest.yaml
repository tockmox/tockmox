    #    product's own alert titles. The first take had exactly that.

known_defects:
  - image: getting-started/grafana-dashboards.jpg
    found: 2026-09-03
    problem: >-
      The caption in getting-started.md read "The shipped dashboards", and not
      one of the nine Tockmox-authored boards is in the frame -- they sort under
      a `Tockmox /` prefix below the fold. This file already had the evidence:
      the entry's own `shows:` line lists only upstream boards. Nobody read the
      two together, which is the same shape as the five-versus-nine board count
      that shipped in prose for two weeks.
    fix: caption reworded 2026-09-03 to describe the frame. The right reshoot
      scrolls to the `Tockmox /` group or filters on the `tockmox` tag, so the
      picture shows what the sentence claims.
    still_open_after: 2026-09-12 ... same cause as the kubernetes-mixin entry
      below; the frame is behind Grafana SSO and the login did not complete.

  - image: getting-started/chat-home.jpg
    found: 2026-09-03
    problem: >-
      This entry, chat-model-selector and chat-first-reply all carried
      `state: fresh install` while showing a working model. what-you-get.md says
      a fresh install shows an EMPTY model list, deliberately. "fresh install,
      gateway configured" was two states at once: a fresh install is exactly the
      one with no gateway configured. The frames are fine; the label taught the
      opposite of the documented first-run state, and an external review
      predicted the resulting issue ("Where is the model gateway after install?").
    fix: state labels corrected 2026-09-03 on all three. A reshoot is not
      required -- a first-run gallery legitimately shows a configured site, so
      long as it does not call itself stock.

  - image: getting-started/grafana-sso-login.jpg
    found: 2026-09-03
    problem: >-
      A password manager's badges sit inside both input fields, putting a
      browser extension in a product shot.
    fix: reshoot in a clean profile with extensions disabled. Cosmetic, and it
      misleads nobody; lowest priority on this list.
    resolved: >-
      2026-09-12 ... reshot from headless Chromium in-cluster, which carries no
      extensions at all, so the badges cannot recur by construction.

  - image: monitoring/kubernetes-mixin-cluster.jpg
    found: 2026-09-03
    problem: >-
      docs/operations/monitoring.md captions this "on a fresh install", but the
      frame shows a `news` namespace, which no stock Tockmox install creates --
      it is a site app from the devtest site. The caption asserts a state the
      image contradicts. A visible mouse cursor also sits over the CPU Quota
      table.
    fix: reshoot on a greenfield install, or reword the caption to stop
      claiming fresh-install state.
    still_open_after: >-
      2026-09-12. The greenfield existed and the reshoot was not taken: both remaining Grafana frames are behind SSO, and SSO into Grafana
      did not complete on this run. NOT recorded as a product defect ... the
      account used was an akadmin created by hand through the first-run setup
      and added to the groups with `ak shell`, which is not how a real user
      arrives, and Argo Workflows' SSO through the SAME Authentik DID complete.
      Cause not established. The run sheet's N11 is the row that measures this
      properly, with real users, on the lab.
    resolved: >-
      2026-10-04, the caption half ... monitoring.md now says the frame was shot
      on the devtest site and that a stock install does not create the extra
      namespace, so the caption no longer asserts a fresh-install state. The
      reshoot and the cursor remain open and cosmetic.

# Wanted, and not capturable until an install is standing again. Both argocd.
# and chat.<internalDomain> returned a browser error on 2026-09-03; the cluster
