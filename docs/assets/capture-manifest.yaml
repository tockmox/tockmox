# Screenshot capture manifest
#
# WHY THIS FILE EXISTS. Every screenshot in this repository is a dated artifact
# with an application version baked into its pixels, and no gate looks at
# images. `check-doc-claims.sh` re-measures prose against the tree; nothing
# re-measures a JPG against the product. A Grafana minor bump moves the nav, an
# Open WebUI release moves the composer, and the page still renders green while
# showing a UI that no longer exists.
#
# This file is the re-capture instruction set. It records, for each image, the
# host it came from, the state the shot assumes, the version visible in the
# frame, and where it is referenced -- so a pre-release QA pass can reshoot
# without reconstructing any of that from scratch.
#
# It is YAML rather than Markdown deliberately: `docs/**/*.md` is the OKF
# bundle and every page in it carries frontmatter and generated stamps. This is
# maintenance data, not a page, and it should not join that corpus.

convention:
  format: jpg
  # Every existing capture is the browser CONTENT AREA only. No window chrome,
  # no URL bar, no tab strip, no bookmarks.
  chrome: none
  width_px: 1470          # 1456-1489 across the current set; not enforced
  size_range_kb: [21, 95]
  # House style: alt text is a full descriptive sentence saying what the reader
  # is looking at and what state it is in. Not a label, not a filename.
  alt_text: descriptive sentence

  # NOTE FOR A FUTURE PASS. The devtest site's internalDomain is a reserved
  # example domain, so the URL bar is not actually a leak here. Cropping it out
  # is a choice, not a requirement, and it throws away information a reader
  # could use -- the https scheme, the lock, and the `<service>.<your-domain>`
  # pattern every console follows. Worth revisiting rather than inheriting.

