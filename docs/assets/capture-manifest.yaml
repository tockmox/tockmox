gaps:
  # ALL FOUR FILLED 2026-09-12, on the throwaway greenfield built for the rc3
  # install round rather than on an install stood up for the purpose. Each entry
  # below is kept as the record of what the capture taught, because three of the
  # four described the target incorrectly and a future pass would repeat it.

  - chart: tockmox-identity
    host: auth.<internalDomain>
    wanted: Authentik, the layer's own UI rather than an SSO button on a
      downstream console
    status: FILLED ... getting-started/authentik-admin.jpg
    resolved: >-
      The ordering question this entry raised is settled BY THE PRODUCT, not by
      a choice. A stock Tockmox install leaves `akadmin` with no usable
      password, so `auth.<internalDomain>` serves authentik's first-run
      `/setup` flow ... Tockmox-branded ... and there IS no bootstrapped admin
      UI until an operator completes that form. So the two captures never
      competed for one instance: /setup is simply the earlier state of every
      install. On a disposable cluster you can shoot /setup, complete it, and
      shoot the admin UI, losing nothing.
    not_committed: >-
      A /setup capture was taken on this run and is NOT in this repository.
      Whether the first-run screen deserves an entry of its own is Jeff's call,
      not a capture problem ... the image exists and can be added without
      another greenfield.
    stale_claim: >-
      charts/tockmox-identity/README.md still carries "four of nine Authentik
      blueprints fail on a greenfield cluster". On THIS greenfield
      `tools/check-blueprint-discovery.sh` reported 5/5 present and 5
      successful, and the identity layer reached Synced + Healthy. Carded
      rather than edited here ... one passing shape is not proof the defect is
      gone in every shape, and that banner is a product-status claim.
    stale_claim_resolved: >-
      2026-10-04 ... the banner is no longer in charts/tockmox-identity/README.md
      (checked on main at 65cafba). This entry is kept as the record; it no
      longer describes the tree.

  - chart: tockmox-platform
    host: the in-cluster Service        # the gap said longhorn.<internalDomain>
    wanted: the Longhorn UI, showing volumes and the backup target
    status: PARTIALLY FILLED ... monitoring/longhorn-volumes.jpg covers volumes
    backup_target_NOT_captured: >-
      The backup target is REAL and was verified on this run ...
      `s3://tockmox-backups@garage/longhorn`, `available: true`, and
      `/v1/backuptargets` returns it ... but no UI frame was obtained. The
      `#/backuptarget` hash renders an empty generic table reading "No Data"
      while the API returns the target, so that route is not the one the UI
      uses, and the nav's "Backup and Restore" entry is a dropdown whose
      children are not plain links at load. NOT a product defect: the API and
      the CR agree with each other and disagree only with a route this capture
      guessed. Establish the real route before the next attempt.
    also: >-
      `longhorn.<internalDomain>` does not exist. A stock install creates six
      ingress hosts ... auth, chat, grafana, llm, ntfy, workflows.

  - chart: tockmox-ai
    host: llm.<internalDomain>/ui
    wanted: the LiteLLM gateway admin UI
    status: FILLED ... getting-started/litellm-admin.jpg
    note: >-
      Shipped OFF through 0.7.x; `apps.litellm.enabled: true` had to be set in
      the site's ai.yaml BEFORE the root Application was applied (on by default
      since 0.8.0, TM-0460; the frame predates that). The admin panel is
      at /ui and the bare host serves the Swagger API page; the panel logs in
      with username `admin` and the gateway master key.

  - chart: tockmox-observability
    host: ntfy.<internalDomain>
    wanted: ntfy showing a delivered alert, proving the notification path
    status: FILLED ... monitoring/ntfy-alert-delivered.jpg
    note: >-
      Needs the tockmox-ntfy-auth Secret, or ntfy stays deny-all. Two capture
      traps are recorded on the image's own entry above: publish AFTER the
      browser has subscribed, and give the capture host an emoji font.

