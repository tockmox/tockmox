    #    the browser subscribed never appears, so the topic reads `0` and the
    #    shot becomes the empty inbox this gap existed to avoid. Publish AFTER
    #    the page is open.
    # 2. The capture host needs an EMOJI FONT. ntfy renders tag icons as emoji;
