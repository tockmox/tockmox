#
# THE DOCUMENTED HIGH-AVAILABILITY SHAPE FOR LOKI (TM-0778), layered over the
# observability chart. docs/operations/monitoring.md quotes it; tools/check-loki-ha.sh
# renders it and asserts what comes out. Not a default and not installed by
# anything: a site that wants Loki to survive a node going away copies this
# into its own values and points it at an object store it already runs.
#
# The endpoint below is the Garage that the platform layer ships with
# dataProtection. The credentials are NOT here: the Loki chart does not read a
# Secret by name, so they are expanded from environment variables (the chart
# already starts Loki with -config.expand-env=true) that come from a Secret the
# site creates (`loki-s3` with keys ACCESS_KEY and SECRET_KEY).
loki:
  loki:
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        endpoint: http://tockmox-garage.tockmox-platform.svc:3900
        region: garage
        accessKeyId: ${LOKI_S3_ACCESS_KEY}
        secretAccessKey: ${LOKI_S3_SECRET_KEY}
        s3ForcePathStyle: true
        insecure: true
    commonConfig:
      replication_factor: 3
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      retention_enabled: true
      delete_request_store: s3
  singleBinary:
    replicas: 3
    extraEnv:
      - name: LOKI_S3_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: loki-s3, key: ACCESS_KEY}
      - name: LOKI_S3_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: loki-s3, key: SECRET_KEY}
