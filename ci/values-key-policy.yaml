# The key policy fixture (TM-0991): the module, its policy file and its registration. Layered on ci/values.yaml.
modelGateway:
  keyPolicy:
    enabled: true
    allowAllModelsAliases: [ops-readonly]
litellm:
  proxy_config:
    general_settings:
      custom_key_policy: hooks.tockmox_key_policy.check
